<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="船を走らせるだけ、釣りは全自動。3分でカツオを何本獲れるかを競うスコアアタック。">
<meta name="theme-color" content="#03121d">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="カツオ一本釣り / Fish On! ~Pole & Line">
<meta property="og:description" content="マウスで進む向きだけを決める3分間のスコアアタック。魚群に船べりを寄せると漁師が自動で一本釣りする。">
<meta property="og:type" content="website">
<title>カツオ島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1+Code:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* 単一ビジュアルワールド（外洋・夜明けの海）に意図的にコミットしたゲーム画面。
     ホストのテーマに関わらず同じ絵を出すため、全色を明示的に塗る。 */
  :root{
    --abyss:#03121d;
    --deep:#072a42;
    --sea:#0b3d5e;
    --panel:#0a1f2e;
    --panel2:#0e2a3d;
    --line:#1c4b68;
    --line2:#2c6c8f;
    --foam:#eaf3f4;
    --mist:#9db8c6;
    --dim:#67879a;
    --gold:#f2b32c;
    --gold2:#c98a12;
    --hata:#e0332c;
    --kelp:#3fbfa0;
    --wood:#3a2717;
    --wood2:#54381f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--abyss); color:var(--foam);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .num{font-family:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
  .disp{font-family:"Reggae One","Zen Kaku Gothic New",system-ui,sans-serif; font-weight:400; letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

  #stage{position:fixed; inset:0; display:grid; place-items:center;
    background:radial-gradient(120% 100% at 50% 0%, #0a2436 0%, #03121d 70%)}
  #frame{
    position:relative; aspect-ratio:16/9;
    width:min(100vw, calc(100vh * 16 / 9)); height:auto; max-height:100vh;
    font-size:calc(min(100vw, 100vh * 16 / 9) / 64);
    overflow:hidden; touch-action:none; cursor:crosshair;
    box-shadow:0 0 0 1px #12374d, 0 30px 90px -30px #000;
  }
  #game{position:absolute; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;}

  /* ---- HUD ---- */
  #hud{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s}
  #hud.on{opacity:1}
  .topbar{position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start;
    justify-content:space-between; gap:1em; padding:.85em 1em}

  .clock{display:flex; align-items:baseline; gap:.5em;
    background:linear-gradient(180deg,rgba(10,31,46,.92),rgba(6,22,34,.92));
    border:1px solid var(--line); border-left:3px solid var(--gold);
    padding:.35em .8em .4em; border-radius:2px}
  .clock .k{font-size:.72em; letter-spacing:.22em; color:var(--dim)}
  .clock .v{font-size:1.7em; font-weight:700; letter-spacing:.02em}
  .clock .fuel{position:relative; display:inline-block; width:8em; height:.75em;
    border:1px solid var(--line2); background:rgba(3,18,29,.9); border-radius:1px;
    overflow:hidden; vertical-align:middle}
  .clock .fuel i{display:block; height:100%; width:100%;
    background:linear-gradient(90deg,var(--kelp),var(--gold)); transition:width .2s linear}
  .clock.warn .fuel i{background:linear-gradient(90deg,#ff8b6a,#e0332c)}
  /* 帰港に要るぶんの目盛り。ここを割ったら港へ戻れない */
  .clock .fuel u{position:absolute; top:-1px; bottom:-1px; width:2px; margin-left:-1px;
    background:var(--foam); box-shadow:0 0 0 1px rgba(3,18,29,.8)}
  .clock .fuel u[hidden]{display:none}
  .clock.warn .fuel u{background:#ffd0a0}
  .clock.warn .v{color:#ff8b6a}
  .clock.warn{border-left-color:#ff8b6a}

  .catch{position:relative; text-align:right; padding:.3em 1em .45em 1.9em;
    background:linear-gradient(180deg,#e0332c,#b31f1c); transition:background .2s ease;
    clip-path:polygon(1.5em 0, 100% 0, 100% 100%, 0 100%);
    box-shadow:0 6px 22px -10px #000}
  .catch .k{font-size:.7em; letter-spacing:.24em; color:#ffd9c9; display:block; line-height:1}
  .catch .v{display:inline-block; transform-origin:100% 60%; font-size:2.1em; line-height:1.05;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.28)}
  .catch .u{font-size:.9em; margin-left:.15em}
  .catch.hot{background:linear-gradient(180deg,#f7c245,#d1830d)}
  .catch.hot .k{color:#6b4a10}

  .lvbar{position:absolute; top:4.1em; left:50%; transform:translateX(-50%);
    width:30%; min-width:12em}
  .lvbar .row{display:flex; justify-content:space-between; align-items:baseline;
    font-size:.66em; letter-spacing:.2em; color:var(--dim); margin-bottom:.35em}
  .lvbar .track{height:.36em; background:rgba(3,18,29,.8); border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .lvbar .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--kelp),var(--gold)); transition:width .18s linear}

  .stats{position:absolute; left:1em; bottom:1em; display:flex; gap:.4em; flex-wrap:wrap; max-width:60%}
  .chip{display:flex; align-items:center; gap:.35em; padding:.3em .5em;
    background:rgba(10,31,46,.82); border:1px solid var(--line); border-radius:2px; opacity:.55}
  .chip.has{opacity:1; border-color:var(--line2)}
  .chip canvas{width:1.4em; height:1.4em; image-rendering:pixelated; display:block}
  .chip b{font-size:.72em; font-weight:500; color:var(--mist); letter-spacing:.06em}
  .chip i{font-style:normal; font-size:.82em; font-weight:700; color:var(--gold);
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .cap{color:#ff6b5c}
  #stats.dbg .chip{pointer-events:auto; cursor:pointer; opacity:1;
    border-color:var(--kelp); box-shadow:0 0 0 1px rgba(63,191,160,.25)}
  #stats.dbg .chip:hover{background:rgba(63,191,160,.22)}
  #stats.dbg .chip:active{transform:translateY(1px)}
  .chip i u{text-decoration:none; font-size:.72em; font-weight:500; color:#c2ad83; margin-left:.1em}

  .sonar{position:absolute; right:1em; bottom:1em; width:11em; text-align:right}
  .sonar canvas{width:100%; aspect-ratio:1; display:block; border-radius:50%;
    box-shadow:0 0 0 1px var(--line), 0 0 30px -8px rgba(63,191,160,.5), inset 0 0 20px rgba(0,0,0,.6)}

  /* 入れ食い：メーターが溜まるほど縁が焼ける。溜まりきると判子が落ちる */
  .fever{position:absolute; inset:0; pointer-events:none; opacity:0; z-index:2;
    background:radial-gradient(115% 78% at 50% 50%, rgba(224,51,44,0) 42%, rgba(224,51,44,.34) 100%);
    box-shadow:inset 0 0 4.2em 1.5em rgba(224,51,44,.8), inset 0 0 1.5em .45em rgba(255,146,86,.6)}
  .fever.hot{animation:fvpulse .48s ease-in-out infinite alternate}
  @keyframes fvpulse{from{filter:brightness(.72)} to{filter:brightness(1.4)}}
  @media (prefers-reduced-motion:reduce){ .fever.hot{animation:none; filter:brightness(1)} }
  /* 走りながら読ませる数字は置かない。連と確定だけ */
  .fvbadge{position:absolute; top:6.2em; left:50%; display:flex; align-items:baseline; gap:.55em;
    padding:.22em .9em .3em; opacity:0; transform:translate(-50%,0) scale(1.7); overflow:hidden;
    background:linear-gradient(180deg,#4a0f0c,#2c0806); border:1px solid #ff8b6a; border-radius:2px;
    box-shadow:0 .5em 1.5em -.4em rgba(224,51,44,.95);
    transition:opacity .14s ease, transform .16s cubic-bezier(.2,1.5,.4,1)}
  .fvbadge.on{opacity:1; transform:translate(-50%,0) scale(1)}
  /* 背景がそのまま残り時間。もう一度当てると満タンに戻る */
  .fvbar{position:absolute; left:0; top:0; bottom:0; width:100%;
    background:linear-gradient(180deg,#e0332c,#a81d18)}
  .fvbar.low{background:linear-gradient(180deg,#ff9a3c,#d1830d)}
  .fvbadge b,.fvbadge em{position:relative; z-index:1}
  .fvbadge b{font-size:.92em; font-weight:700; letter-spacing:.26em; color:#fff}
  .fvbadge em{font-style:normal; font-size:.82em; font-weight:700; color:#ffd0a0; letter-spacing:.04em}
  /* 発動の瞬間に大きく落ちる字 */
  .fvbig{position:absolute; left:50%; top:29%; z-index:3; pointer-events:none; white-space:nowrap;
    opacity:0; transform:translate(-50%,-50%) scale(3.2);
    font-size:4.4em; letter-spacing:.08em; color:#fff;
    text-shadow:0 0 .35em rgba(255,190,90,.95), 0 .05em 0 #a81d18, 0 .06em .02em #6b0f0c, 0 .3em 1em rgba(0,0,0,.75)}
  .fvbig.go{animation:fvslam 1.1s cubic-bezier(.18,1.5,.3,1) both}
  @keyframes fvslam{
    0%{opacity:0; transform:translate(-50%,-50%) scale(3.2)}
    14%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    22%{transform:translate(-50%,-50%) scale(1.08)}
    32%{transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.3)}
  }
  @media (prefers-reduced-motion:reduce){
    .fvbig.go{opacity:1; transform:translate(-50%,-50%) scale(1)}
  }

  .toast{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:.3em; text-align:center;
    opacity:0; transition:opacity .3s}
  .toast.on{opacity:1}
  .toast .hd{font-size:1.1em; color:var(--gold); letter-spacing:.2em}
  .toast .it{font-size:.85em; color:var(--foam); background:rgba(3,18,29,.7); padding:.15em .7em; border:1px solid var(--line)}

  /* ---- overlays ---- */
  #menu{z-index:8}
  .mbtn.armed{border-color:#ff8b6a; color:#ff8b6a}
  .scrim{position:absolute; inset:0; display:none; place-items:center; padding:1.5em; cursor:default;
    background:radial-gradient(120% 90% at 50% 40%, rgba(4,26,42,.86), rgba(2,12,20,.95));
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); pointer-events:auto}
  .scrim.on{display:grid}

  .prompt{position:absolute; inset:0; display:grid; justify-items:center; align-content:space-between;
    text-align:center; pointer-events:none; padding:2.2em 1.5em 2.6em; opacity:1;
    transition:opacity .45s ease;
    background:linear-gradient(180deg, rgba(3,18,29,.72) 0%, rgba(3,18,29,0) 38%, rgba(3,18,29,0) 62%, rgba(3,18,29,.66) 100%)}
  .prompt.gone{opacity:0}
  .tap{margin:0; font-size:.9em; letter-spacing:.24em; color:var(--mist);
    animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55} 50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ .tap{animation:none; opacity:.85} }
  .kanji{font-size:.8em; letter-spacing:.7em; color:var(--gold); margin-bottom:.6em}
  h1{margin:0; font-size:3.4em; line-height:1.1; text-wrap:balance;
    color:var(--foam); text-shadow:0 .06em 0 #08202f, 0 .5em 1.4em rgba(0,0,0,.6)}
  h1 em{font-style:normal; color:var(--hata)}
  .tsub{margin:.25em 0 0; font-size:1em; letter-spacing:.06em; color:var(--mist)}
  .tsub:empty{display:none}
  .lede{margin:.9em auto 0; max-width:26em; font-size:.92em; line-height:1.85; color:var(--mist)}
  .keys{display:flex; gap:1.4em; justify-content:center; margin-top:1.4em; flex-wrap:wrap}
  .keys div{font-size:.78em; color:var(--dim)}
  .keys b{display:block; font-size:1.15em; color:var(--foam); font-weight:500; margin-bottom:.2em}
  button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
  .go{margin-top:1.6em; padding:.7em 2.6em; font-size:1.05em; letter-spacing:.3em;
    color:#2a0b09; background:linear-gradient(180deg,#ffc44a,#e09b12);
    border-radius:2px; box-shadow:0 10px 26px -12px rgba(242,179,44,.8);
    transition:transform .12s ease, box-shadow .12s ease}
  .go:hover{transform:translateY(-2px); box-shadow:0 16px 30px -12px rgba(242,179,44,.9)}
  .go:active{transform:translateY(0)}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .best{margin-top:.7em; font-size:.78em; letter-spacing:.18em; color:var(--dim)}

  /* 網を揚げた瞬間の一括表示 */
  .haul{position:absolute; left:50%; top:19%; transform:translate(-50%,-50%); z-index:3;
    font-size:3.4em; font-weight:700; letter-spacing:.02em; color:var(--gold);
    pointer-events:none; opacity:0; white-space:nowrap;
    text-shadow:0 .04em 0 #6b4a10, 0 .18em .7em rgba(242,179,44,.65)}
  .haul.on{opacity:1; animation:none}
  .haul.go{animation:haulpop .95s cubic-bezier(.2,1.6,.35,1) both}
  @keyframes haulpop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.35)}
    16%{opacity:1; transform:translate(-50%,-50%) scale(1.18)}
    30%{transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-62%) scale(1)}
  }
  @media (prefers-reduced-motion:reduce){ .haul.go{animation-duration:.5s} }

  /* level up */
  #levelup .box{text-align:center}
  .lvhd{font-size:.78em; letter-spacing:.44em; color:var(--gold); margin-bottom:.25em}
  .lvsub{font-size:1.5em; margin-bottom:1.1em; color:var(--foam)}
  .cards{display:flex; gap:1em; justify-content:center; flex-wrap:wrap}
  .card{position:relative; width:11.5em; padding:1.1em .9em 1em; text-align:center;
    background:linear-gradient(180deg,#432e1b,#2c1d10);
    border:1px solid #6b4a26; border-top:3px solid var(--gold); border-radius:2px;
    box-shadow:0 18px 34px -18px #000; cursor:pointer;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease}
  .card:hover{transform:translateY(-6px); border-color:var(--gold); box-shadow:0 26px 40px -18px #000}
  .card .no{position:absolute; top:.4em; left:.55em; font-size:.66em; color:#9c7c50}
  .card canvas{width:3.4em; height:3.4em; image-rendering:pixelated; margin:.2em auto .55em; display:block}
  .card .nm{font-size:1.05em; font-weight:700; color:#ffe9bd}
  .card .lv{font-size:.7em; letter-spacing:.16em; color:var(--gold); margin-top:.15em}
  .card .val{display:flex; align-items:baseline; justify-content:center; gap:.3em; flex-wrap:wrap;
    margin-top:.6em; font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .card .val s{text-decoration:none; font-size:1em; color:#a4855c}
  .card .val em{font-style:normal; color:#8a6f4a; font-size:.9em}
  .card .val b{font-size:1.6em; line-height:1; color:var(--gold); font-weight:700}
  .card .val i{font-style:normal; font-size:.78em; color:#c7ab82}
  .card .ef{font-size:.76em; color:#e2cda6; margin-top:.5em; line-height:1.5}
  .card .fl{font-size:.7em; color:#a98f6b; margin-top:.5em; line-height:1.5}
  .card.max{opacity:.55}

  /* result */
  #result .box{text-align:center; min-width:min(30em,90%)}
  .rhd{font-size:.78em; letter-spacing:.5em; color:var(--dim)}
  .score{font-size:4.6em; line-height:1; color:var(--gold); margin:.1em 0 .05em;
    text-shadow:0 .04em 0 #6b4a10, 0 .3em 1.2em rgba(242,179,44,.35)}
  .score span{font-size:.32em; letter-spacing:.1em; margin-left:.2em; color:var(--foam)}
  .rank{font-size:1.15em; color:var(--foam); margin-top:.2em}
  .rank small{display:block; font-size:.6em; color:var(--mist); margin-top:.35em; letter-spacing:.06em}
  .grow{margin-top:.9em; font-size:.95em; color:var(--mist);
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .grow s{text-decoration:none; color:var(--dim)}
  .grow b{font-size:1.45em; color:var(--gold); margin:0 .1em}
  .grow em{font-style:normal; color:var(--hata); font-weight:700; margin-left:.4em}
  .rrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    gap:1em 1.2em; margin:1.3em auto 0; max-width:22em}
  .rrow div{font-size:.72em; color:var(--dim); letter-spacing:.1em}
  .rrow b{display:block; font-size:1.45em; color:var(--foam); font-weight:500; letter-spacing:0;
    font-family:"M PLUS 1 Code",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .rrow b span{font-size:.5em; color:var(--mist); margin-left:.1em}
  .rrow em{display:block; font-style:normal; font-size:.92em; color:#4f6c7d; letter-spacing:0; margin-top:.1em}
  .newbest{display:inline-block; margin-top:.7em; padding:.2em .9em; font-size:.72em; letter-spacing:.28em;
    color:#fff; background:var(--hata)}

  /* ---- 港。海の絵をそのまま背景として使う（別画面へは飛ばさない） ---- */
  .port{position:absolute; inset:0; pointer-events:none; z-index:4}
  .port[hidden]{display:none}
  .port>*{pointer-events:auto}
  /* 所持金と水揚げ・人口の欄。左上だと島に被るので、桟橋と船の下の空いた海（右下）に寄せる */
  .pinfo{position:absolute; right:1em; bottom:1em; display:flex; flex-direction:column;
    align-items:flex-end; gap:.35em}
  .pmoney{display:flex; align-items:baseline; gap:.5em;
    padding:.35em .9em .4em; background:linear-gradient(180deg,rgba(10,31,46,.94),rgba(6,22,34,.94));
    border:1px solid var(--line); border-right:3px solid var(--gold); border-radius:2px}
  .pmoney span{font-size:.68em; letter-spacing:.22em; color:var(--dim)}
  .pmoney b{font-size:1.5em; color:var(--gold); font-weight:700}
  .plog{font-size:.74em; line-height:1.7; color:var(--mist); text-align:right;
    padding:.3em .8em; background:rgba(6,22,34,.72); border-radius:2px;
    font-family:"M PLUS 1 Code",ui-monospace,monospace; white-space:pre; text-shadow:0 1px 2px #000}
  .plog b{color:var(--foam)} .plog em{font-style:normal; color:var(--gold)}
  .plog u{text-decoration:none; color:#ff8b6a}
  /* 建物に合わせる吹き出し。位置は JS が % で入れる */
  .ptip{position:absolute; transform:translate(-50%,-100%); pointer-events:none;
    padding:.3em .7em .35em; white-space:nowrap; text-align:center;
    background:linear-gradient(180deg,rgba(10,31,46,.96),rgba(6,22,34,.96));
    border:1px solid var(--line2); border-bottom:2px solid var(--gold); border-radius:2px;
    box-shadow:0 8px 18px -10px #000}
  .ptip[hidden]{display:none}
  .ptip b{display:block; font-size:.92em; color:#ffe9bd; font-weight:700; letter-spacing:.06em}
  .ptip em{display:block; font-style:normal; font-size:.72em; color:var(--mist); margin-top:.1em}
  .rq{white-space:nowrap} .rq.ok{color:#6fae8e} .rq.ng{color:#ff8b6a} .rq.ahead{color:var(--dim)}
  .punlock{position:absolute; left:50%; top:1em; transform:translate(-50%,-6px); opacity:0; pointer-events:none;
    display:flex; gap:.6em; align-items:baseline; padding:.4em 1em; white-space:nowrap;
    background:linear-gradient(180deg,rgba(10,31,46,.96),rgba(6,22,34,.96)); border:1px solid var(--gold);
    border-radius:2px; box-shadow:0 10px 24px -12px #000; transition:opacity .2s ease, transform .2s ease}
  .punlock.on{opacity:1; transform:translate(-50%,0)}
  .punlock b{color:var(--gold); font-size:.9em; letter-spacing:.1em}
  .punlock span{color:var(--foam); font-size:.86em}
  .punlock .newship{color:var(--gold); font-size:1.1em; letter-spacing:.06em}
  .pshop{position:absolute; width:19em; max-height:60%; overflow:auto;
    padding:.5em; background:linear-gradient(180deg,rgba(10,31,46,.96),rgba(6,22,34,.96));
    border:1px solid var(--line); border-radius:2px; box-shadow:0 18px 34px -18px #000}
  .pshop[hidden]{display:none}
  .prow{display:flex; align-items:center; gap:.55em; width:100%; padding:.45em .5em;
    background:rgba(255,255,255,.03); border:1px solid transparent; border-radius:2px; text-align:left}
  .prow+.prow{margin-top:.3em}
  .prow canvas{width:1.7em; height:1.7em; image-rendering:pixelated; flex:0 0 auto}
  .prow .nm{flex:1 1 auto; font-size:.84em; color:var(--foam); line-height:1.35}

let LANG='ja';                 // Playables では SDK の getLanguage で決める
function t(k,p){
  let v=(STR[LANG]&&STR[LANG][k]);
  if(v===undefined) v=STR.ja[k];
  if(v===undefined) return k;
  if(p) for(const n in p) v=v.split('{'+n+'}').join(p[n]);
  return v;
}
let NUMFMT=new Intl.NumberFormat('ja-JP');
function fmt(n){ return NUMFMT.format(n); }
function setLang(code){
  LANG=(code&&STR[code])?code:'ja';
  NUMFMT=new Intl.NumberFormat(LANG==='en'?'en-US':'ja-JP');
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
function gx(c){const g=c.getContext('2d');g.imageSmoothingEnabled=false;return g;}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function line(g,x0,y0,x1,y1,c,th){ // 整数ピクセルの直線
  th=th||1; const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx-dy, x=x0, y=y0;
  g.fillStyle=c;
  for(let i=0;i<200;i++){ g.fillRect(x,y,th,th);
    if(x===x1&&y===y1)break; const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;} if(e2<dx){err+=dx;y+=sy;} }
}

/* ---------------- カツオ（極小スプライト＋回転アトラス） ---------------- */
const FISH_MAP=[
  '#.....####...',
  '##..#########',
  '#############',
  '##..#########',
  '#.....####...'
];
const FISH_PAL=[
  ['#2f739c','#12466a','#0c3752','#12466a','#2b6b91'],
  ['#245f84','#0f3c5c','#0a3048','#0f3c5c','#215a7d'],
  ['#1a4d6c','#0d3450','#092a40','#0d3450','#184868']
];
const FISH_ALPHA=[1,.88,.6], FISH_SCALE=[1,.92,.78];
/* 釣り上げられて空中にいるカツオ。水中用とは用途が違うので別に持つ。
   真上から見た暗い背中ではなく、横向きで腹の銀色が出る絵にする。 */
const AIR_MAP=[
  '.....####....',
  '#...#########',
  '##.##########',
  '##.##########',
  '#...#########',
  '.....####....'
];
const AIR_PAL=['#1b4665','#275d84','#5798c2','#b7dcef','#f4fafd','#d2e4ef'];
const ANG=24, CELL=16;   // 13x5 の回転に必要なのは13.9px。余白を詰めて合成面積を減らす
let fishAtlas=null;

function fishBase(d){
  const w=13,h=5, pal=FISH_PAL[d];
  const c=mkc(w,h), g=gx(c);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(FISH_MAP[y][x]!=='#') continue;
    px(g,x,y,1,1,pal[y]);
  }
  if(d<2){                             // 背のツヤと両目
    px(g,9,2,3,1, d===0?'#4291b9':'#2c6f95');
    px(g,11,1,1,1,'#06202f'); px(g,11,3,1,1,'#06202f');
  }
  const s=FISH_SCALE[d];
  if(s===1) return c;
  const w2=Math.max(6,Math.round(w*s)), h2=Math.max(3,Math.round(h*s));
  const c2=mkc(w2,h2), g2=gx(c2); g2.drawImage(c,0,0,w2,h2); return c2;
}
function fishAir(){
  const w=13,h=6, c=mkc(w,h), g=gx(c);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++)
    if(AIR_MAP[y][x]==='#') px(g,x,y,1,1,AIR_PAL[y]);
  px(g,7,3,1,1,'#8fc0dc'); px(g,9,3,1,1,'#8fc0dc');   // 体側の縞
  px(g,10,1,1,1,'#0a2233');                            // 目
  px(g,12,2,1,2,'#e8f4fb');                            // 口先の照り返し
  return c;
}
function buildFishAtlas(){
  fishAtlas=mkc(CELL*ANG, CELL*4);
  const g=gx(fishAtlas);
  for(let d=0;d<4;d++){
    const base=d<3?fishBase(d):fishAir();
    for(let a=0;a<ANG;a++){
      g.save();
      g.globalAlpha=d<3?FISH_ALPHA[d]:1;
      g.translate(a*CELL+CELL/2, d*CELL+CELL/2);
      g.rotate(a/ANG*TAU);
      g.drawImage(base, -base.width/2, -base.height/2);   // 丸めるとセル中心から0.5pxずれて端が欠ける
      g.restore();
    }
  }
  /* 魚は毎フレーム数千枚出る。転送元が canvas のままだと1枚ごとに取り込み直しが要る。
     ImageBitmap にしておくと絵は1pxも変わらないまま、その取り込みが消える。 */
  if(typeof createImageBitmap==='function')
    createImageBitmap(fishAtlas).then(b=>{ fishAtlas=b; }).catch(()=>{});
}

/* ---------------- 漁船（Lv1〜Lv5・独立生成） ---------------- */
const HULL_LEN=[52,68,88,112,144];
const SEAT_GAP=8;
const boats=[];

function buildBoat(lv){
  const len=HULL_LEN[lv-1];
  const W=len+14, H=46, railY=22, waterY=34;
  const c=mkc(W,H), g=gx(c);
  const x0=5, x1=W-5;
  const top=[], bot=[];
  for(let x=x0;x<=x1;x++){
    let t=railY, b=waterY+3;
    const fb=(x-(x1-16))/16;                    // 船首側の反り
    if(fb>0) t-=Math.round(4*fb*fb);
    const fs=((x0+10)-x)/10;                    // 船尾側
    if(fs>0) t-=Math.round(2*fs*fs);
    const e=Math.min((x-x0)/4,(x1-x)/6,1);      // 前後の絞り
    b-=Math.round((1-e)*6);
    if(b<=t) b=t+1;
    top[x]=t; bot[x]=b;
    px(g,x,t,1,b-t,'#000');
  }
  g.globalCompositeOperation='source-atop';
  px(g,0,0,W,railY+5,'#e9f0f3');                // 白い外板
  px(g,0,railY+5,W,2,'#d8322a');                // 朱の帯
  px(g,0,railY+7,W,H,'#15455f');                // 喫水下
  px(g,0,waterY,W,H,'#0e3149');
  g.globalCompositeOperation='source-over';
  for(let x=x0;x<=x1;x++){
    px(g,x,top[x],1,1,'#7c98a8');               // 船べりのハイライト
    px(g,x,bot[x]-1,1,1,'#08202f');
  }
  // 舷側の細部
  for(let x=x0+14;x<x1-8;x+=13){ px(g,x,railY+9,3,3,'#0b2b3d'); px(g,x+1,railY+9,1,1,'#123b52'); }
  px(g,x1-14,railY+2,10,2,'#c2ced5');
  // 操舵室（船尾）
  const wh=[10,12,14,16,18][lv-1], hh=[9,11,12,14,16][lv-1], wx=x0+5;
  px(g,wx,railY-hh,wh,hh,'#eef4f6');
  px(g,wx,railY-hh,wh,1,'#b9c7cf');
  px(g,wx,railY-1,wh,1,'#9fb0ba');
  for(let i=0;i<Math.floor(wh/4);i++) px(g,wx+2+i*4,railY-hh+3,2,3,'#123b52');
  px(g,wx-1,railY-hh-1,wh+2,1,'#d8322a');       // 屋根の朱線
  // マストと大漁旗
  const mx=wx+wh-2, my=railY-hh-1;
  px(g,mx,my-9,1,9,'#8a6a3f');
  px(g,mx+1,my-9,5,3,'#d8322a');
  px(g,mx+1,my-6,4,2,'#f2b32c');
  if(lv>=3){ px(g,mx-4,my-6,3,2,'#cfd9de'); px(g,mx-3,my-4,1,3,'#8a6a3f'); }
  if(lv>=4){ px(g,wx+wh+2,railY-5,6,5,'#dbe4e8'); px(g,wx+wh+3,railY-4,4,1,'#123b52'); }
  if(lv>=5){ px(g,x1-24,railY-4,7,4,'#dbe4e8'); px(g,x1-23,railY-3,5,1,'#123b52'); }
  // 釣り座
  const seatX=[];
  for(let x=x0+13; x<=x1-14; x+=SEAT_GAP) seatX.push(x);
  return {cv:c,W,H,railY,waterY,seatX,len};
}

/* ---------------- 船の絵を足す ----------------
   性能の差は乗員上限だけ（どんな船だったかは気にしない）。
   長さは釣り座の数で決まる。釣り座は SEAT_GAP ごとに両舷へ並ぶ */
function hullMask(g,x0,x1,railY,waterY,shape){      // 船体の輪郭を黒で塗り、上下の縁を返す
  const top=[], bot=[];
  for(let x=x0;x<=x1;x++){
    const r=shape(x); let t=railY+r.t, b=waterY+r.b;
    if(b<=t) b=t+1;
    top[x]=t; bot[x]=b; px(g,x,t,1,b-t,'#000');
  }
  return {top,bot};
}
function seatsOf(x0,x1){ const a=[]; for(let x=x0+13; x<=x1-14; x+=SEAT_GAP) a.push(x); return a; }
function hline(g,xa,ya,xb,yb,col){                  // 長い張り線用（line は200pxで打ち切る）
  const n=Math.max(Math.abs(xb-xa),Math.abs(yb-ya))|0;
  for(let i=0;i<=n;i++) px(g,Math.round(xa+(xb-xa)*i/n),Math.round(ya+(yb-ya)*i/n),1,1,col);
}

/* 木造の小舟。板張りで両端が反り上がる */
function buildRowboat(){
  const len=52, W=len+14, H=46, railY=26, waterY=36;
  const c=mkc(W,H), g=gx(c), x0=5, x1=W-5;
  const {top,bot}=hullMask(g,x0,x1,railY,waterY,x=>{
    const u=(x-x0)/(x1-x0), e=Math.min((x-x0)/6,(x1-x)/6,1);
    return {t:-Math.round(5*Math.pow(Math.abs(u-0.5)*2,2.2)), b:3-Math.round((1-e)*7)};
  });
  g.globalCompositeOperation='source-atop';
  px(g,0,0,W,H,'#8a5a2e');
  for(let y=railY+2;y<H;y+=3) px(g,0,y,W,1,'#6e4522');   // 板の継ぎ目
  px(g,0,waterY,W,H,'#4a2f18');
  g.globalCompositeOperation='source-over';
  for(let x=x0;x<=x1;x++){ px(g,x,top[x],1,1,'#c28a52'); px(g,x,top[x]+1,1,1,'#5a3a1c'); px(g,x,bot[x]-1,1,1,'#2b1a0b'); }
  line(g,x0+9,railY,x0+2,waterY+3,'#a07448');             // 櫂
  px(g,x0+4,railY-13,1,13,'#8a6a3f');                     // 船尾の旗竿
  px(g,x0+5,railY-13,5,3,'#d8322a'); px(g,x0+5,railY-10,4,2,'#f2b32c');
  return {cv:c,W,H,railY,waterY,seatX:seatsOf(x0,x1),len, flag:{x:x0+4, y:railY-14}};
}

/* タイタニック。黒い外板、白い上部構造、バフ色の煙突4本 */
function buildTitanic(){
  const len=220, W=len+14, H=84, railY=56, waterY=70;
  const c=mkc(W,H), g=gx(c), x0=5, x1=W-5;
  const {top,bot}=hullMask(g,x0,x1,railY,waterY,x=>{
    const fb=(x-(x1-24))/24, e=Math.min((x-x0)/8,(x1-x)/5,1);
    return {t:fb>0?-Math.round(3*fb*fb):0, b:4-Math.round((1-e)*8)};
  });
  g.globalCompositeOperation='source-atop';
  px(g,0,0,W,H,'#1a1a1e');
  px(g,0,railY+3,W,1,'#d9b24a');                          // 金の帯
  px(g,0,waterY-1,W,H,'#9c2a22');                         // 喫水下の赤
  g.globalCompositeOperation='source-over';
  for(let x=x0;x<=x1;x++) px(g,x,top[x],1,1,'#e9e4d8');
  for(let x=x0+10;x<x1-10;x+=4) px(g,x,railY+6,1,1,'#e8d9a0');   // 丸窓
  for(let x=x0+12;x<x1-14;x+=4) px(g,x,railY+9,1,1,'#b8a870');
  const sx0=x0+30, sx1=x1-44;
  px(g,sx0,railY-8,sx1-sx0,8,'#f2efe6'); px(g,sx0,railY-8,sx1-sx0,1,'#fffdf5');
  for(let x=sx0+2;x<sx1-2;x+=3) px(g,x,railY-5,2,2,'#2a3a48');
  px(g,sx0+8,railY-14,sx1-sx0-16,6,'#ebe7dc');
  for(let x=sx0+10;x<sx1-10;x+=3) px(g,x,railY-12,2,2,'#2a3a48');
  for(let x=sx0+10;x<sx1-12;x+=14) px(g,x,railY-16,8,2,'#f6f3ea');  // 救命ボート
  const fw=9, fh=26, span=sx1-sx0-24;
  for(let i=0;i<4;i++){                                   // 煙突。上ほど艫へ傾ける
    const fx=sx0+12+Math.round(span*i/3);
    for(let y=0;y<fh;y++){
      const lean=Math.round(y*0.18), yy=railY-14-y;
      px(g,fx-lean,yy,fw,1, y>fh-5?'#141414':'#d99a3a');
      if(y<=fh-5) px(g,fx-lean,yy,1,1,'#b07a26');
    }
  }
  const m1=x1-22, m2=x0+18;                               // マストと張り線
  px(g,m1,railY-40,1,40,'#6b5a44'); px(g,m2,railY-36,1,36,'#6b5a44');
  hline(g,m2,railY-36,m1,railY-40,'#8a8070');
  return {cv:c,W,H,railY,waterY,seatX:seatsOf(x0,x1),len, flag:{x:m2, y:railY-46}};
}

/* 戦艦大和。主砲塔3基（前2・後1）、塔型の艦橋、傾いた煙突 */
function buildYamato(){
  const len=300, W=len+14, H=84, railY=58, waterY=70;
  const c=mkc(W,H), g=gx(c), x0=5, x1=W-5;
  const {top,bot}=hullMask(g,x0,x1,railY,waterY,x=>{
    const fb=(x-(x1-60))/60, fs=((x0+14)-x)/14, e=Math.min((x-x0)/6,(x1-x)/10,1);
    return {t:(fb>0?-Math.round(5*fb*fb):0)+(fs>0?Math.round(fs):0), b:4-Math.round((1-e)*8)};
  });
  g.globalCompositeOperation='source-atop';
  px(g,0,0,W,H,'#7c858c');
  px(g,0,railY+2,W,1,'#6a737a');
  px(g,0,waterY-1,W,H,'#6b2a26');
  g.globalCompositeOperation='source-over';
  for(let x=x0;x<=x1;x++){ px(g,x,top[x],1,1,'#a4adb3'); px(g,x,bot[x]-1,1,1,'#2e1412'); }
  px(g,x1-5,top[x1-5]+2,2,2,'#e8c24a');                  // 艦首の金
  const G='#8b949b', GD='#5f676d', GL='#aab3b9', BAR='#4c5358';
  function turret(cx,lift,facing){
    const tw=22, th=8, ty=railY-th-lift;
    if(lift) px(g,cx-tw/2+3,ty+th,tw-6,lift,GD);          // 背負い式の台
    px(g,cx-tw/2,ty,tw,th,G); px(g,cx-tw/2,ty,tw,1,GL); px(g,cx-tw/2,ty+th-1,tw,1,GD);
    for(let i=0;i<3;i++){
      const by=ty+2+i*2;
      if(facing>0) px(g,cx+tw/2,by,18,1,BAR); else px(g,cx-tw/2-18,by,18,1,BAR);
    }
  }
  turret(x1-78,0,1); turret(x1-108,5,1); turret(x0+56,0,-1);
  const bx=x1-150;                                        // 艦橋
  let y=railY;
  for(const [w,h] of [[26,6],[22,6],[18,6],[14,6],[10,5],[8,5]]){
    y-=h; px(g,bx-w/2,y,w,h,G); px(g,bx-w/2,y,w,1,GL);
    for(let x=bx-w/2+2;x<bx+w/2-2;x+=3) px(g,x,y+2,1,1,'#2a3036');
  }
  px(g,bx-7,y-3,14,2,BAR); px(g,bx,y-12,1,9,BAR);        // 測距儀とマスト
  const fx=bx-38;                                         // 煙突
  px(g,fx-4,railY-6,16,6,G);
  for(let yy=0;yy<22;yy++){ const lean=Math.round(yy*0.35); px(g,fx-lean,railY-6-yy,12,1, yy>18?'#2a2e32':G); }
  px(g,x0+86,railY-26,1,26,BAR); px(g,x0+80,railY-22,13,1,BAR);   // 後檣
  for(const ax of [bx+22,bx-60,bx-80]){ px(g,ax-4,railY-4,8,4,G); px(g,ax+4,railY-3,6,1,BAR); }  // 副砲
  return {cv:c,W,H,railY,waterY,seatX:seatsOf(x0,x1),len, flag:{x:bx, y:y-22}};
}

/* ---------------- 漁師（2頭身・下半身なし・竿と糸を一体化） ---------------- */
const FPAL=[
  {shirt:'#22536f',shirt2:'#173c53',hat:'#d9b160',skin:'#e2a878',band:null},
  {shirt:'#c86a2c',shirt2:'#9a4f1e',hat:null,skin:'#d69a6b',band:'#e0332c'},
  {shirt:'#e3ebef',shirt2:'#b9c6cd',hat:'#1d4a68',skin:'#e8b98a',band:null}
];
const fishers=[[],[]];   // [row][pose] -> [palette]

function buildFisher(pi,row,pose){
  const W=24,H=34, c=mkc(W,H), g=gx(c);
  const p=FPAL[pi];
  const by = row===0 ? 17 : 26;          // 腰の切断面（near/far で位置を変える）
  const hy = by-15;                      // 頭の上端
  const cx = 7;
  // 頭
  px(g,cx-3,hy+1,7,6,p.skin);
  px(g,cx-2,hy,5,1,p.skin);
  px(g,cx+2,hy+3,1,1,'#3a2418'); px(g,cx,hy+3,1,1,'#3a2418');
  if(p.hat){ px(g,cx-5,hy+1,11,1,p.hat); px(g,cx-3,hy-1,7,2,p.hat); px(g,cx-3,hy+1,7,1,'#00000033'); }
  else if(p.band){ px(g,cx-3,hy+1,7,2,p.band); px(g,cx+3,hy+1,3,1,p.band); }
  // 胴（短い）
  px(g,cx-3,by-8,7,8,p.shirt);
  px(g,cx-3,by-8,7,1,p.shirt2);
  px(g,cx-3,by-2,7,2,p.shirt2);
  // 腕と竿
  let ax0,ay0,tx,ty;
  if(pose===0){
    if(row===0){ ax0=cx+4; ay0=by-6; tx=21; ty=by+13; }
    else       { ax0=cx+4; ay0=by-7; tx=21; ty=by-19; }
  }else{
    ax0=cx+5; ay0=by-11; tx=22; ty=by-(row===0?16:24);
  }
  px(g,cx+3,ay0-1,3,3,p.skin);                       // 手
  px(g,cx+1,ay0-2,3,4,p.shirt);                      // 腕
  if(pose===1) px(g,cx+1,ay0-3,3,4,p.shirt);
  line(g,ax0,ay0,tx,ty,'#caa268');                   // 一本釣り竿（リールなし）
  line(g,ax0+1,ay0,tx,ty-1,'#8f6f42');
  const lx=tx, ly=ty;
  if(pose===0){                                      // 糸の出だしだけ。続きは水中側で動的に描く
    const dy = row===0? 2 : -2;
    line(g,lx,ly,lx,ly+dy,'#cfdde6');
  }
  if(row===1){                                       // 向こう舷は沈める
    g.globalCompositeOperation='source-atop';
    px(g,0,0,W,H,'rgba(4,32,52,.34)');
    g.globalCompositeOperation='source-over';
  }
  return {cv:c, ax:cx, ay:by, tip:{x:lx-cx, y:ly-by}};
}

const netters=[[],[]];   // [row][pose] -> [palette]  網漁用

/* 網漁の漁師。頭と胴は一本釣りと同じ人。腕から先だけ差し替える。
   pose0 = 綱を構えて待つ / pose1 = 締め。後ろへ体重をかけて両手で手繰る */
function buildNetter(pi,row,pose){
  const W=24,H=34, c=mkc(W,H), g=gx(c);
  const p=FPAL[pi];
  const by = row===0 ? 17 : 26;
  const hy = by-15;
  const cx = 7;
  const ln = pose===1 ? -1 : 0;                      // 締めは1px後ろへ反る
  const dir = row===0 ? 1 : -1;                      // 手前舷は手前の水へ、向こう舷は奥へ
  // 頭
  px(g,cx-3+ln,hy+1,7,6,p.skin);
  px(g,cx-2+ln,hy,5,1,p.skin);
  px(g,cx+2+ln,hy+3,1,1,'#3a2418'); px(g,cx+ln,hy+3,1,1,'#3a2418');
  if(p.hat){ px(g,cx-5+ln,hy+1,11,1,p.hat); px(g,cx-3+ln,hy-1,7,2,p.hat); px(g,cx-3+ln,hy+1,7,1,'#00000033'); }
  else if(p.band){ px(g,cx-3+ln,hy+1,7,2,p.band); px(g,cx+3+ln,hy+1,3,1,p.band); }
  // 胴
  px(g,cx-3+ln,by-8,7,8,p.shirt);
  px(g,cx-3+ln,by-8,7,1,p.shirt2);
  px(g,cx-3+ln,by-2,7,2,p.shirt2);
  // 腕と手。網そのものは船に1枚あるので、ここは人の仕草だけ
  let hx,hy2,tx,ty;
  if(pose===0){                                      // 構え：舷に手をかけて綱を握る
    px(g,cx+1,by-7,4,3,p.shirt);
    px(g,cx+4,by-6,3,3,p.skin);
    hx=cx+6; hy2=by-5;
    tx=cx+10; ty=by+dir*7;
  }else{                                             // 締め：肘を引いて両手で手繰る
    px(g,cx+2+ln,by-12,4,3,p.shirt);
    px(g,cx+5+ln,by-12,3,3,p.skin);
    px(g,cx+1+ln,by-6,4,3,p.shirt);
    px(g,cx+4+ln,by-6,3,3,p.skin);
    hx=cx+7+ln; hy2=by-11;
    tx=cx+11; ty=by+dir*3;
  }
  line(g,hx,hy2,tx,ty,'#c9b184');                    // 舷を越える綱
  line(g,hx,hy2+1,tx,ty+dir,'#8a7450');
  if(pose===1){                                      // 手繰った綱がたるむ
    px(g,cx+7+ln,by-9,1,1,'#c9b184');
    px(g,cx+8+ln,by-7,1,1,'#8a7450');
  }
  if(row===1){
    g.globalCompositeOperation='source-atop';
    px(g,0,0,W,H,'rgba(4,32,52,.34)');
    g.globalCompositeOperation='source-over';
  }
  return {cv:c, ax:cx, ay:by, tip:{x:tx-cx, y:ty-by}};
}

/* ---------------- 大漁旗（入れ食い中に船室の上で振る） ---------------- */
const flagCv=[];
function buildFlag(){
  for(let f=0;f<4;f++){

    px(g,0,0,1,1,'#f2b32c');

      const y=1+Math.round(Math.sin(ph+x*0.62)*1.4)+1;

}

/* ---------------- 「+1」 ---------------- */
let popNorm=null, popFv=null;
function buildPop(){
  const rects=[[2,3,3,1],[3,2,1,3],[6,1,1,5],[5,2,1,1],[5,5,3,1]];   // + と 1
  const mk=(col)=>{
    const c=mkc(9,7), g=gx(c);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){            // 海に埋もれないよう縁取り
      if(!dx&&!dy) continue;
      for(const r of rects) px(g,r[0]+dx,r[1]+dy,r[2],r[3],'#0a2233');
    }
    for(const r of rects) px(g,r[0],r[1],r[2],r[3],col);
    return c;
  };
  popNorm=mk('#ffffff'); popFv=mk('#ff5a4a');
}

/* ---------------- カモメ（真上から見た2コマ＋8方向） ---------------- */
const GULL_MAP=[
  ['..#..','..#..','#####','..#..','..#..'],    // 翼を広げた
  ['.....','..#..','#####','..#..','.....']     // 打ち下ろし
];
const GANG=8, GCELL=8;
let gullAtlas=null;
function buildGull(){
  gullAtlas=mkc(GCELL*GANG, GCELL*2);
  const g=gx(gullAtlas);
  for(let f=0;f<2;f++){
    const base=mkc(5,5), b=gx(base), rows=GULL_MAP[f];
    for(let y=0;y<5;y++) for(let x=0;x<5;x++)
      if(rows[y][x]==='#') px(b,x,y,1,1, y===2?'#eaf3f4':'#cfdde6');
    px(b,4,2,1,1,'#ffffff');                    // 頭
    px(b,0,2,1,1,'#9db8c6');                    // 尾
    for(let a=0;a<GANG;a++){
      g.save();
      g.translate(a*GCELL+GCELL/2, f*GCELL+GCELL/2);
      g.rotate(a/GANG*TAU);
      g.drawImage(base,-2.5,-2.5);
      g.restore();
    }
  }
}

const HOUSE_SLOTS=(()=>{
  const a=[];
  for(const y of [88,102]) for(let x=8;x<=154;x+=12) a.push([x,y]);
  for(let x=8;x<=150;x+=12) a.push([x,128]);
  for(const y of [150,162,174,186]) a.push([76,y]);
  a.sort((p,q)=>Math.hypot(p[0]-PORT_LANDW,p[1]-PORT_H/2)-Math.hypot(q[0]-PORT_LANDW,q[1]-PORT_H/2));
  return a;
})();
/* 住民何人につき家1軒か。人口が最大のときにちょうど島が埋まるよう、POP から決める */
function housePer(){
  let lv=0; for(const id of FAC_IDS) lv+=FAC[id].max;
  return Math.max(1,(POP.base+POP.perLv*lv)/HOUSE_SLOTS.length);
}
/* 島は施設を上げるたびに描き直す。模様が毎回変わらないよう乱数は固定の種から引く */
function seeded(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);

/* 入港が始まる円。静止しているので1枚に焼いて貼るだけにする */
let portRing=null;
const RING_ON=5, RING_GAP=7;      // 点線の実線と隙間(px)
function buildPortRing(){
  const r=PORT.r, W=r*2+4;
  const c=mkc(W,W), g=gx(c);
  const n=Math.round(TAU*r), per=RING_ON+RING_GAP;
  for(let i=0;i<n;i++){
    if(i%per>=RING_ON) continue;
    const a=i/n*TAU;
    const x=Math.round(r+2+Math.cos(a)*r), y=Math.round(r+2+Math.sin(a)*r);
    px(g,x,y+1,1,1,'rgba(3,18,29,.5)');            // 海に沈まないよう影を1px
    px(g,x,y,1,1,'rgba(242,179,44,.6)');
  }
  portRing=c;
}

/* 港の絵のどの画素を世界の原点に置くか。ここが島の位置を決める唯一の値で、
   船をどこに舫うか（PORT.dock）とは切り離してある */
const PORT_ANCHOR={x:PORT_W-46, y:PORT_H/2};
function portOrigin(){ return {x:PORT.x-PORT_ANCHOR.x, y:PORT.y-PORT_ANCHOR.y}; }
/* 陸の当たり。buildPort の陸（スプライトの x:0〜150, y:26〜174）を世界座標に直したもの。
   絵を描き変えたらここも合わせる。margin は汀線の岩のぶんの余白 */
const LAND={ sx0:0, sy0:26, sx1:PORT_LANDW, sy1:PORT_H-26, margin:5 };
function landRect(){
  const o=portOrigin();
  return {x0:LAND.sx0+o.x-LAND.margin, y0:LAND.sy0+o.y-LAND.margin,
          x1:LAND.sx1+o.x+LAND.margin, y1:LAND.sy1+o.y+LAND.margin};
}
/* 陸に入り込んだ点を、いちばん近い岸へ押し戻すぶんを返す。
   毎フレーム止めているので食い込みは1フレームぶんしかなく、最短の辺＝入ってきた辺になる */
function landPush(x,y,L){
  if(x<L.x0||x>L.x1||y<L.y0||y>L.y1) return null;
  const dl=x-L.x0, dr=L.x1-x, dt=y-L.y0, db=L.y1-y;
  const m=Math.min(dl,dr,dt,db);
  if(m===dl) return {x:-dl, y:0};
  if(m===dr) return {x:dr,  y:0};
  if(m===dt) return {x:0, y:-dt};
  return {x:0, y:db};
}
/* 船を陸に乗り上げさせない。船首と船の中心の2点で見る。
   船尾まで見ると、大型船が桟橋に着けたとき尻が岸壁に刺さって着岸できなくなる */
function keepOffLand(){
  const B=S.boat, L=landRect(), half=boats[S.up.hull-1].len/2;
  const pts=[[B.x,B.y],[B.x+Math.cos(B.hd)*half, B.y+Math.sin(B.hd)*half]];
  let hit=null;
  for(const [x,y] of pts){ const d=landPush(x,y,L); if(d && (!hit || Math.abs(d.x)+Math.abs(d.y)>Math.abs(hit.x)+Math.abs(hit.y))) hit=d; }
  if(!hit) return;
  B.x+=hit.x; B.y+=hit.y;
  if(hit.x) B.vx=0;
  if(hit.y) B.vy=0;
  B.sp*=0.25;                                  // 擦った勢いを殺す
  if(S.shake<0.35) S.shake=0.35;               // ぶつかった手応え
}

const FV_ENTRY=0.006;                // 1本あたりの当たり。突入も継続もこれ1つ

/* 釣具は「竿の本数」。稼働している漁師に1本ずつ配り、余ったら2本目3本目を持たせる。
   竿を1本持つごとにその漁師は ROD 倍で釣るので、人手が少ないほど重複が進んで掛け算が効く。
   ＝「漁師でゴリ押し」と「少数精鋭に竿を山盛り」が逆向きのビルドになる */
const BARE=1.25;                     // 竿1本の1人あたり本/秒
const ROD=4;                         // 追加の竿1本ぶんの倍率
const ROD_MAX=2;                     // 1人が持てる追加の竿。元の1本と合わせて3本（両手＋口）が上限
const ACC=2;                         // 全員が3本持ったあと、余った釣具1つぶんの加速
/* 釣具1つで何本の竿が届くかは、積んだ時の稼働人数に比例する。
   2〜5人なら1本、24人なら6本、32人なら8本。少ない人手なら1本ずつ重なって掛け算になり、
   大所帯なら全員に行き渡る。積んだ時点で確定して S.up.rods に貯める（後から人が増えても減らない） */
const ROD_FRAC=0.25;                 // 稼働人数のこの割合ぶんの竿が、釣具1つで届く
function rodGrant(u){
  u=u||S.up;
  return Math.max(1, Math.round(Math.min(u.crew,stat.seats(u))*ROD_FRAC));
}
function rodSplit(u){                // n人に rods 本を配る。3本目まで配ってから、余りは加速に回す
  u=u||S.up;
  const n=Math.max(1,Math.min(u.crew,stat.seats(u))), R=u.rods||0;
  const used=Math.min(R, n*ROD_MAX), over=R-used;
  return {n, q:(used/n)|0, rem:used%n, over};
}

/* 一本釣りが「1匹ずつ連続」なのに対し、網は「周期でまとめて一気に」。
   群れに乗せる操作も強化も入れ食いも全部そのまま。変わるのは獲り方のリズムだけ。
   数値はここに全部集めてある。一本釣り側の定数には一切触れていない */
const NET={
  rMul:2.8,        // 網の半径 = 漁獲範囲rx の何倍
  rCap:200,        // 網の半径の上限。これを超えると網が画面より大きくなって何も見えない

};
function netGear(){ return S.gear==='seine'||S.gear==='trawl'; }
function netR(){ return Math.min(NET.rCap, stat.rx()*NET.rMul); }

/* ================= 曳き網 ================= */
/* 網を船の後ろに曳き、通った水域の魚を連続で獲る。数字は一本釣りと同じで止まらない。
   巻き網と逆で「速く動くほど掃く水が増える」。ただし速いほど目から逃げるので、
   群れの上では緩め、群れの間は飛ばす、が素直な形になる */
const TR={
  w0:34,           // 稼働2人のときの網の口の幅（px）
  wCrew:0.09,      // 稼働1人あたり口が何割広がるか
  wHull:0.28,      // 船体Lv1つあたり口が何割広がるか
  wCap:300,        // 口の幅の上限
  depth:70,        // 網の長さ（口から袋の底まで）
  bag:0.70,        // 袋の底の幅。口に対する割合。絞るほど壁から漏れて底に届かない
  lip:0.30,        // 口の丸み（見た目だけ）
  cod:12,          // 袋の底。ここまで流れ込んだら漁獲
  lag:0.75,        // 船尾からどれだけ後ろに曳くか（船長に対する割合）
  take:0.55,       // 目。基準の取り分
  takeRod:0.05,    // 竿1本あたり取り分が何割増えるか
  takeCap:0.95,
  slip:0.35,       // 倍速のとき取り分がどれだけ落ちるか。上げるほど飛ばす利が減る
  drag:0.35,       // 網が水から受ける抵抗。小さいほど早く止まる＝慣性が消える
  rope:0.85        // 綱に引かれたぶんがどれだけ速度になるか。1で張りっぱなし、小さいと綱が食う
};
/* 網は船に刺さった棒ではなく、綱で曳かれている物体として持つ。
   自分の慣性で真っ直ぐ行こうとし、綱の長さで引き戻される。
   曲がると内側へ流れ、切り返すと振られる。船首から幾何で出すのをやめた */
function trawlLen(){ return boats[S.up.hull-1].len*TR.lag+TR.depth*0.5; }
function trawlHalfW(u){                        // u: 0=口 1=袋の底
  const hw=trawlW()*0.5;
  return hw*(TR.bag+(1-TR.bag)*Math.cos(Math.min(1,Math.max(0,u))*Math.PI/2));
}
function trawlReset(){
  const B=S.boat, L=trawlLen();
  S.trawl.x=B.x-Math.cos(B.hd)*L; S.trawl.y=B.y-Math.sin(B.hd)*L;
  S.trawl.vx=0; S.trawl.vy=0; S.trawl.hd=B.hd;
}
function updateTrawlNode(dt){
  const B=S.boat, T=S.trawl, L=trawlLen();
  T.x+=T.vx*dt; T.y+=T.vy*dt;
  const k=Math.pow(TR.drag, dt);                 // 水の抵抗
  T.vx*=k; T.vy*=k;
  let dx=T.x-B.x, dy=T.y-B.y, d=Math.hypot(dx,dy);
  if(d<1e-4){ dx=-Math.cos(B.hd); dy=-Math.sin(B.hd); d=1; }
  if(d>L){                                       // 綱いっぱい。引き戻して、その移動を速度にする
    const nx=dx/d, ny=dy/d;
    const cx=B.x+nx*L, cy=B.y+ny*L;
    const inv=1/Math.max(dt,1e-4);
    T.vx+=(cx-T.x)*inv*TR.rope; T.vy+=(cy-T.y)*inv*TR.rope;
    T.x=cx; T.y=cy;
  }
  T.hd=Math.atan2(B.y-T.y, B.x-T.x);             // 口は進む側＝船のほうを向く
}
function trawlW(){
  const n=Math.max(1,Math.min(S.up.crew,stat.seats()));
  const w=TR.w0*(1+TR.wCrew*(n-2))*(1+TR.wHull*(S.up.hull-1));
  return Math.min(TR.wCap, w)*(S.fever?FV_RATE:1);
}
function trawlTake(){
  const sp=stat.speed(), over=Math.max(0,(S.boat.sp/Math.max(1,sp)-1)/(NAV_BOOST-1));
  const base=Math.min(TR.takeCap, TR.take*(1+TR.takeRod*(S.up.rods||0)));
  return base*(1-TR.slip*Math.min(1,over));
}
function trawlPos(){ return S.trawl; }     // 網の口の中心
function netCycle(){                       // 漁師が増えるほど手繰りが速い
  const n=Math.max(1,Math.min(S.up.crew,stat.seats()));
  return Math.max(NET.minSec, NET.base/(1+NET.crew*(n-2))/(S.fever?FV_RATE:1));
}
function netTake(){                        // 釣具＝網の目。取りこぼしが減る
  return Math.min(NET.takeCap, NET.take*(1+NET.takeRod*(S.up.rods||0)));
}
function netPower(){                       // 表示用の本/秒（1周期あたりの見込み）
  return S.inRange*netTake()/Math.max(.001,netCycle()+NET.pull);
}

  {id:'big',     art:5, lv:5, seats:32, fuel:18000, price:700000},
  {id:'titanic', art:7, lv:6, seats:50, fuel:30000, price:5000000},
  {id:'yamato',  art:8, lv:7, seats:70, fuel:45000, price:30000000}
];
/* ================= 島の施設 =================
   資金を払う → 施設Lvが上がる → 対応する能力が恒久的に上がる。
   漁師は雇うのではなく島の人口から出る。人口は施設Lvの合計で増え、船に乗れるだけ乗る。
   魚探と集魚はLv1固定 */
const FAC_IDS=['ship','engine','gear','fish','tank'];
const FAC={
  ship:  {name:'造船所',     note:'船を大きくする',   max:4},   // Lv がそのまま SHIPS の番号。値段は SHIPS.price
  /* 残りの4つは Lv0〜10。値段は1段ごとに約2倍で、2段が以前の1段ぶんにあたる。
     上げきるまでの合計額は Lv5 までだったときと同じ */
  engine:{name:'整備場',     note:'船の足を速くする', max:10, price:[2600,5200,10000,21000,42000,84000,170000,340000,670000,1300000]},
  gear:  {name:'漁具工房',   note:'竿を増やす',       max:10, price:[3300,6500,13000,26000,52000,100000,210000,420000,840000,1700000]},
  fish:  {name:'水産加工場', note:'カツオを高く売る', max:10, price:[3900,7800,16000,31000,63000,130000,250000,500000,1000000,2000000]},
  tank:  {name:'燃料タンク', note:'遠くまで行ける',   max:10, price:[2000,3900,7800,16000,31000,63000,130000,250000,500000,1000000]}
};
const FAC_EFF={
  engine:1,     // 整備場1段 = 機関1段（速さ×1.12）。Lv10で以前の機関Lv10と同じ
  gear:0.2,     // 漁具工房1段で、漁師1人あたりの竿が0.2本増える。Lv10で全員が3本持ち（持てる上限）
  fish:0.2,     // 水産加工場1段で売値が2割上がる。Lv10で3倍
  tank:0.28     // 燃料タンク1段で最大燃料が28%増える。Lv10で3.8倍
};
/* ================= アンロック =================
   施設・Lvは「条件を満たす → 解放される → お金を払って建てる」の2段。解放にお金はかからない。
   REQ[施設][Lv] がそのLvに上げるための条件で、次に条件が書かれたLvまでは同じ条件が続く。
   条件はすべて人口。人口は何を建てても増えるので、どの施設から上げても次が開く。
   「均等に上げる」のではなく「合計でどれだけ島を育てたか」で次の船や上のLvに届く。
   {pop:30} は「人口30人以上」。人口 = 2 + 3×施設Lvの合計（最大134） */
const REQ={
  ship:  { 1:[{pop:15}], 2:[{pop:40}], 3:[{pop:75}], 4:[{pop:110}] },
  engine:{ 4:[{pop:25}], 7:[{pop:55}], 9:[{pop:85}] },
  gear:  { 4:[{pop:25}], 7:[{pop:55}], 9:[{pop:85}] },
  tank:  { 4:[{pop:25}], 7:[{pop:55}], 9:[{pop:85}] },
  fish:  { 1:[{pop:10}], 4:[{pop:25}], 7:[{pop:55}], 9:[{pop:85}] }
};
function reqOf(id,L){                 // Lv L に上げるための条件（L以下で一番近く書かれたもの）
  const t=REQ[id]; if(!t) return [];
  let k=-1; for(const key in t) if(+key<=L && +key>k) k=+key;
  return k<0 ? [] : t[k];
}
function condOk(c){ return c.pop ? population()>=c.pop : S.fac[c.f]>=c.lv; }
const FAC_SHORT={engine:'整備', gear:'漁具', fish:'水産', tank:'燃料'};   // 条件を並べるときの短い名前
function condText(c){
  if(c.pop) return '人口'+c.pop;
  return c.f==='ship' ? shipLabel(c.lv) : FAC_SHORT[c.f]+'Lv'+c.lv;
}
function unlocked(id,L){ return reqOf(id,L).every(condOk); }
/* 条件を ✓ / ✗ つきで並べる。足りないものだけ色を変える */
function condHtml(list){
  return list.map(c=>condOk(c) ? '<span class="rq ok">✓'+condText(c)+'</span>'
                               : '<span class="rq ng">✗'+condText(c)+(c.pop?'（いま'+population()+'）':'')+'</span>').join(' ');
}
/* いま次に上げられる段のうち、解放済みのものの集合（新しく開いたものを知らせるため） */
function openSet(){
  const a=new Set();
  for(const id of FAC_IDS){ const L=S.fac[id]+1; if(L<=FAC[id].max && unlocked(id,L)) a.add(id+':'+L); }
  return a;
}
const POP={base:2, perLv:3};   // 人口 = base + perLv × 施設Lvの合計。最初は2人、全部上げきると134人。
                               // 船に乗り切れない分はNPC船に回る

function ship(){ return SHIPS[S.shipIdx]; }
function facPrice(id){
  const lv=S.fac[id];
  if(lv>=FAC[id].max) return Infinity;
  return id==='ship' ? SHIPS[lv+1].price : FAC[id].price[lv];
}
function population(){ let n=0; for(const id of FAC_IDS) n+=S.fac[id]; return POP.base+POP.perLv*n; }
function fishYen(lv){ return Math.round(YEN*(1+FAC_EFF.fish*(lv===undefined?S.fac.fish:lv))); }
function fuelMaxAt(si,tankLv){ return Math.round(SHIPS[si].fuel*(1+FAC_EFF.tank*tankLv)); }
function fuelMax(){ return fuelMaxAt(S.shipIdx, S.fac.tank); }
/* 施設Lvから、船・乗る人数・竿の本数を組み直す。買ったあとと読み込んだあとに呼ぶ */
function applyFac(){
  S.shipIdx=S.fac.ship; S.up.hull=SHIPS[S.shipIdx].art;
  S.up.engine=S.fac.engine*FAC_EFF.engine;
  S.up.sonar=1; S.up.lure=1;
  S.up.crew=Math.min(population(), stat.seats());
  S.up.rods=Math.round(S.up.crew*FAC_EFF.gear*S.fac.gear);
  S.up.rate=S.fac.gear; S.up.tank=S.fac.tank;
  layoutCrew();
  buildFleet();                    // 乗り切れない住民はNPC船へ
}
function portDist(){ return Math.hypot(S.boat.x-PORT.x, S.boat.y-PORT.y); }
/* 濃さの倍率。1=近海、richCap=頭打ち */
function seaRichAt(x,y){
  const d=Math.hypot(x-PORT.x, y-PORT.y);
  if(d<=SEA.near) return 1;
  return Math.min(SEA.richCap, Math.pow(2,(d-SEA.near)/SEA.double));
}
function seaRich(){ return seaRichAt(S.boat.x, S.boat.y); }
/* 上の倍率を 0〜1 に直したもの。群れの数や密度など、青天井にしたくないものに使う */
function seaT(){ return Math.log2(seaRich())/Math.log2(SEA.richCap); }

const SHIP_SPD_DROP=0.02, SHIP_TURN_DROP=0.04;   // 速さ/旋回の倍率 小舟1.00 → 漁船0.96/0.92 → 大型0.92/0.84 → タイタニック0.90/0.80 → 大和0.88/0.76
                                                // 重さは出すが爽快感を削らない程度に留める
const stat = {
  rate:(u)=>stat.power(u)/Math.max(1,rodSplit(u).n),   // 1人あたりの平均。表示には使わない
  /* 大きい船ほど最高速も旋回も少しずつ落ちる（格1段ごとに SHIP_SPD_DROP / SHIP_TURN_DROP） */
  speed:(u)=>{u=u||S.up; return 52*Math.pow(1.12,u.engine)*(1-SHIP_SPD_DROP*(ship().lv-1));},
  turn:(u)=>{u=u||S.up; return 5.0*Math.pow(1.10,u.engine)*(1-SHIP_TURN_DROP*(ship().lv-1));},
  sonar:(u)=>250*Math.pow(1.32,(u||S.up).sonar-1),
  lureR:(u)=>{u=u||S.up; return u.lure===0?0:150+70*u.lure;},
  lureF:()=>S.up.lure*3.4,
  seats:()=>{ const sh=ship(); return Math.min(sh.seats, boats[sh.art-1].seatX.length*2); },
  power:(u)=>{const {n,q,rem,over}=rodSplit(u);       // 船全体の本/秒
    return BARE*(rem*Math.pow(ROD,q+1)+(n-rem)*Math.pow(ROD,q))*Math.pow(ACC,over);},
  rx:()=>HULL_LEN[S.up.hull-1]/2+24,
  ry:()=>42
};
/* 表示は Lv ではなく実数で。漁師=稼働/総数、船体=最大乗船人数、魚探と集魚=初期比 */
const SONAR_BASE=250, LURE_BASE=220;
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(2)+t('unit.km') : Math.round(m)+t('unit.m'); }
function valOf(id,u){
  let r={n:'',u:''};
  switch(id){
    case 'crew': {                       // 素直に総人数。釣り座からあふれている間だけ赤
      const over=u.crew>stat.seats(u);
      r={n:String(u.crew), h:over?'<span class="cap">'+u.crew+'</span>':String(u.crew), u:t('unit.crew'), cap:over};
      break;
    }
    case 'hull':   r={n:String(stat.seats(u)), u:t('unit.crew')}; break;
    case 'rate': {
      if(netGear()){                                // 網では釣具＝網の目。取り分で見せる
        const tk=Math.min(NET.takeCap, NET.take*(1+NET.takeRod*(u.rods||0)));
        r={n:Math.round(tk*100)+'%', u:''}; break;
      }
      const v=stat.power(u);                        // 船全体の本/秒。序盤は小さいので小数を残す
      r={n: v<100? v.toFixed(1) : fmt(Math.round(v)), u:t('unit.rate')}; break; }
    case 'engine': r={n:(stat.speed(u)*0.25).toFixed(1), u:t('unit.knot')}; break;
    case 'sonar':  r={n:'+'+Math.round((stat.sonar(u)/SONAR_BASE-1)*100)+'%', u:''}; break;
    case 'tank':   r={n:fmtDist(fuelMax()*M_PER_PX), u:''}; break;
    case 'fish':   r={n:'¥'+fmt(fishYen()), u:'/本'}; break;
    case 'lure':   r = u.lure===0 ? {n:t('unit.none'), u:''}
                     : {n:'+'+Math.round((stat.lureR(u)/LURE_BASE-1)*100)+'%', u:''}; break;
  }
  if(!r.h) r.h=r.n;
  return r;
}
function nextUp(id){
  const u=Object.assign({},S.up);
  if(id==='crew') u.crew+=3;
  else if(id==='hull') u.hull=Math.min(5,u.hull+1);
  else { if(id==='rate') u.rods=(u.rods||0)+rodGrant(); u[id]++; }
  return u;
}
function loadBest(){ try{return parseInt(localStorage.getItem('ippon.best')||'0',10)||0;}catch(e){return 0;} }
function saveBest(v){ try{localStorage.setItem('ippon.best',String(v));}catch(e){} }
function loadGear(){ try{const v=localStorage.getItem('ippon.gear'); return (v==='seine'||v==='trawl')?v:'pole';}catch(e){return 'pole';} }
function saveGear(v){ try{localStorage.setItem('ippon.gear',v);}catch(e){} }
