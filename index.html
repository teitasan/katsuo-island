<script>
"use strict";
/* ================= アセット構築 ================= */
function initAssets(){
  buildFishAtlas(); buildSea(); buildChest(); buildGull(); buildPop(); buildFlag(); buildPortRing(); buildAnchor(); buildNote();
  for(let lv=1;lv<=5;lv++) boats.push(buildBoat(lv));
  /* 6=木造の小舟 7=タイタニック 8=戦艦大和。SHIPS の art がこの番号を指す */
  for(const b of [buildRowboat(), buildTitanic(), buildYamato()]){ boats.push(b); HULL_LEN.push(b.len); }
  for(let r=0;r<2;r++){ fishers[r]=[[],[]]; netters[r]=[[],[]];
    for(let p=0;p<2;p++) for(let i=0;i<3;i++){
      fishers[r][p][i]=buildFisher(i,r,p);
      netters[r][p][i]=buildNetter(i,r,p);
    } }
  UPG_IDS.forEach(id=>ICONS[id]=buildIcon(id));
  ICONS.ship=buildIcon('hull'); ICONS.gear=ICONS.rate;
}

/* ================= 魚群 ================= */
const schoolRadius=n=>Math.min(140,Math.sqrt(n)*5.0);   // 上限で頭打ちにして、大群ほど密にする
/* カモメは完全に飾り。群れより広く回るので、魚が見えるより先に居場所が知れる。
   数が群れの規模に比例するので「多い＝大きい」の予告になる */
const GULL={min:140, k:3.4, max:14, lo:1.15, hi:1.95};
function makeGulls(n0){
  if(n0<GULL.min) return null;
  const k=Math.min(GULL.max, Math.round(Math.sqrt(n0)/GULL.k));
  const out=[];
  for(let i=0;i<k;i++) out.push({a:rnd(0,TAU), w:rnd(.22,.5)*(Math.random()<.5?-1:1),
    r:rnd(GULL.lo,GULL.hi), ph:rnd(0,TAU), fs:rnd(5,9)});
  return out;
}
const PSTEP=4, PN=104;            // 先頭の軌跡を4px刻みで416pxぶん保持する
/* 表に出さない副効果の係数（1レベルあたり） */
const TUNE={ lureSchoolSize:0.12, sonarChestRate:0.15 };
function makeSchool(x,y,count){
  const rx=schoolRadius(count), ry=rx*0.6;
  const ang=rnd(0,TAU), ca=Math.cos(ang), sa=Math.sin(ang);
  const hx=x+ca*rx, hy=y+sa*rx;   // x,y は群れの胴体中心。先頭はその前方
  const s={x:hx, y:hy, cx:x, cy:y, ca:ang, ang, hd:ang, sp:rnd(9,18), rx, ry,
    turn:0, k:1, pulse:rnd(0,TAU), pi:0, pfrac:0,
    path:new Float32Array(PN*5), alive:count, n0:count, fish:new Array(count), gulls:makeGulls(count)};
  for(let i=0;i<PN;i++){                       // 初期軌跡はまっすぐ後ろへ
    const b=(((0-i)%PN)+PN)%PN*5;
    s.path[b]=hx-ca*i*PSTEP; s.path[b+1]=hy-sa*i*PSTEP;
    s.path[b+2]=ca; s.path[b+3]=sa; s.path[b+4]=ang;
  }
  for(let i=0;i<count;i++){
    const a=rnd(0,TAU), u=Math.pow(Math.random(),0.72), r=Math.random();   // 0.5が一様。大きいほど中心が濃い
    const ox=Math.cos(a)*u*rx;
    s.fish[i]={d:rx-ox, oy:Math.sin(a)*u*ry,      // d=先頭からの弧長距離
      dd:(r<.3?2:(r<.66?1:0)),
      ph:rnd(0,TAU), ps:rnd(2.2,4.4), alive:true, wx:hx, wy:hy, a:ang};
  }
  s.fish.sort((p,q)=>q.dd-p.dd);
  return s;
}
/* ================= 鳥山（ナブラ） =================
   ときどき海のどこかに、鳥の群がる大群が短いあいだだけ湧く。
   魚探の範囲より外に湧き、範囲外のあいだは魚探の縁に方角だけ出る。近づくと本体が映る。
   行くかどうかは燃料との相談で、間に合わなければ潜って消える。
   航海ごとに当たり外れを作るのが目的。入れ食いの仕組みには触っていない */
const TORI={
  first:[20,75],      // 出港してから最初に湧くまで（秒）。短い航海では湧かないこともある
  every:[55,95],      // 次が湧くまでの間隔。航海中だけ数える
  rate:3,             // 鳥山の上にいる間、漁師の手が何倍速くなるか。
                      // 濃い群れを置くだけだと竿の速さで頭打ちになり、よそで獲れたぶんと
                      // 入れ替わるだけで総数が増えなかった。ここが鳥山の「当たり」の本体
  life:32,            // 湧いてから散りはじめるまで
  size:6,             // その場の普通の群れの何倍の魚か
  tight:0.72,         // 群れの半径の倍率。小さいほど密で、竿の下に魚が溜まる
  dist:[350,650],     // 湧く距離（船から px）。魚探Lv1の半径250pxより外なので、魚探の縁に方角だけ出る
  gulls:24,           // 群がる鳥の数
  dive:2.6,           // 散りはじめてから潜りきるまで
  warn:8,             // 残りこの秒数になると魚探の目印が速く点滅する
  boil:90             // 画面に入っているあいだ水面が跳ねる数（毎秒）
};
function toriFlock(n){
  const out=[];
  for(let i=0;i<n;i++) out.push({a:rnd(0,TAU), w:rnd(.35,.8)*(Math.random()<.5?-1:1),
    r:rnd(0.35,1.35), ph:rnd(0,TAU), fs:rnd(7,11)});
  return out;
}
function spawnTori(){
  const B=S.boat;
  for(let tries=0;tries<16;tries++){
    const a=rnd(0,TAU), d=rnd(TORI.dist[0],TORI.dist[1]);
    const x=B.x+Math.cos(a)*d, y=B.y+Math.sin(a)*d;
    if(Math.hypot(x-PORT.x,y-PORT.y)<SEA.portClear+160) continue;   // 港の足元には出さない
    const rich=seaRichAt(x,y);
    const n=Math.round(100*rich*TORI.size*(1+TUNE.lureSchoolSize*(S.up.lure-1)));
    const sc=makeSchool(x,y,n);
    const p=Math.log2(rich)/Math.log2(SEA.richCap);
    sc.rx*=(1-(1-SEA.tightMax)*p)*TORI.tight; sc.ry*=(1-(1-SEA.tightMax)*p)*TORI.tight;
    sc.gulls=toriFlock(TORI.gulls);
    sc.tori={age:0};
    S.schools.push(sc); S.totalFish+=n;
    tone(1568,.07,'square',.04,1.18); tone(1318,.09,'square',.035,1.12,.09);   // 鳥が鳴く
    return sc;
  }
  return null;
}
function updateTori(dt){
  if(S.phase==='sea'){
    S.toriT-=dt;
    if(S.toriT<=0){ spawnTori(); S.toriT=rnd(TORI.every[0],TORI.every[1]); }
  }
  for(const s of S.schools){
    const T=s.tori; if(!T) continue;
    T.age+=dt;
    if(T.age<TORI.life || s.alive<=0) continue;
    /* 時間切れ。群れが潜っていく。残りを均して dive 秒で消し、潜ったところに輪を出す */
    if(T.left===undefined) T.left=s.alive;
    let k=Math.ceil(T.left*dt/TORI.dive);
    for(let i=s.fish.length-1;i>=0 && k>0;i--){
      const f=s.fish[i]; if(!f.alive) continue;
      f.alive=false; s.alive--; S.totalFish--; k--;
      if(S.rings.length<120 && Math.random()<.35) S.rings.push({x:f.wx, y:f.wy, t:0});
    }
  }
  spawnToriBoil(dt);
}
/* 鳥山は入れ食いでなくても水面が沸いている。見つけたときに「あれだ」と分かるように */
function spawnToriBoil(dt){
  for(const s of S.schools){
    if(!s.tori || s.alive<=0 || s.tori.age>=TORI.life) continue;
    if(Math.abs(s.cx-camX)>VW/2+s.rx || Math.abs(s.cy-camY)>VH/2+s.rx) continue;
    s.tori.acc=(s.tori.acc||0)+dt*(REDUCE?TORI.boil*0.3:TORI.boil);
    let n=s.tori.acc|0; s.tori.acc-=n;
    const fs=s.fish;
    while(n-->0 && S.boil.length<BOIL_MAX){
      const f=fs[rint(0,fs.length-1)]; if(!f.alive) continue;
      S.boil.push({x:f.wx+rnd(-2,2), y:f.wy+rnd(-1,1), t:0, life:rnd(.26,.42), k:rnd(.7,1.25), d:Math.random()<.5?1:-1});
    }
  }
}
/* ax,ay のまわりに群れを1つ湧かせる。濃さはその場所の港からの距離で決まる */
function spawnSchoolNear(ax,ay){
  const rich=seaRichAt(ax,ay), p=Math.log2(rich)/Math.log2(SEA.richCap);
  const n=Math.round(rnd(50,150)*rich*(1+TUNE.lureSchoolSize*(S.up.lure-1)));  // 隠し効果：集魚で群れが大きくなる
  // 湧き距離は群れの中心ではなく「手前側の縁」で測る。
  // 半径を足さないと、大きい群れほど画面の中に身体がはみ出して出現する
  const a=rnd(0,TAU), d=schoolRadius(n)+rnd(290,520);
  const sxw=ax+Math.cos(a)*d, syw=ay+Math.sin(a)*d;
  if(Math.hypot(sxw-PORT.x,syw-PORT.y)<SEA.portClear+schoolRadius(n)) return;   // 港の足元は空
  const sc=makeSchool(sxw, syw, n);
  sc.rx*=1-(1-SEA.tightMax)*p; sc.ry*=1-(1-SEA.tightMax)*p;   // 沖ほど密＝漁獲効率
  S.schools.push(sc); S.totalFish+=n;
}
function manageWorld(dt){
  const B=S.boat, p=seaT();   // 時間ではなく港からの距離。遠いほど濃い海になる
  const target=Math.round(14*(1+(SEA.countMax-1)*p)), DESP=1000;
  /* 群れを保つ場所：自分の船と、海に出ているNPC船 */
  const anchors=[[B.x,B.y]];
  if(S.phase==='sea') for(const nb of S.npcs) if(nb.state!=='dock') anchors.push([nb.x,nb.y]);
  for(let i=S.schools.length-1;i>=0;i--){
    const s=S.schools[i];
    /* 港へ入り込んだ群れは片づけるが、消すのは画面の外にいるときだけ。
       見えているものを消すと、釣っている最中に群れが忽然と消える */
    const cm=camPos();
    const offScreen = Math.abs(s.cx-cm.x)>VW/2+s.rx*s.k+24 || Math.abs(s.cy-cm.y)>VH/2+s.ry*s.k+24;
    const inPort = Math.hypot(s.cx-PORT.x,s.cy-PORT.y)<SEA.portClear*0.8;
    let far=true; for(const [ax,ay] of anchors) if(Math.hypot(s.cx-ax,s.cy-ay)<=DESP){ far=false; break; }
    if(s.alive<=0 || (inPort&&offScreen) || far){ S.totalFish-=s.alive; S.schools.splice(i,1); }
  }
  const near=(ax,ay,r)=>{ let n=0, f=0; for(const s of S.schools) if(Math.hypot(s.cx-ax,s.cy-ay)<r){ n++; f+=s.alive; } return [n,f]; };
  const cap=20000*(1+TUNE.lureSchoolSize*(S.up.lure-1));  // 終盤は海を埋める。集魚のぶん更に上げる
  { let guard=0, [n,f]=near(B.x,B.y,DESP);
    while(n<target && f<cap && guard++<6){ const before=S.schools.length; spawnSchoolNear(B.x,B.y); if(S.schools.length>before){ n++; f+=S.schools[S.schools.length-1].alive; } } }
  for(let k=1;k<anchors.length;k++){                       // NPC船のまわりは少なめ
    const [ax,ay]=anchors[k]; let [n]=near(ax,ay,900), guard=0;
    while(n<NPC.schools && guard++<3){ const before=S.schools.length; spawnSchoolNear(ax,ay); if(S.schools.length>before) n++; }
  }
  if(S.mode!=='play' || !S.started) return;
  S.chestT-=dt;
  if(S.chestT<=0){
    const sn=S.up.sonar;
    S.chestT=rnd(24,34)/(1+TUNE.sonarChestRate*(sn-1));   // 隠し効果：魚探で宝箱が見つかりやすくなる
    if(S.chests.length<2+((sn-1)>>1)){
      const a=rnd(0,TAU), d=rnd(300,560);
      S.chests.push({x:B.x+Math.cos(a)*d, y:B.y+Math.sin(a)*d, life:52, ph:rnd(0,TAU)});
    }
  }
  for(let i=S.chests.length-1;i>=0;i--){
    const c=S.chests[i]; c.life-=dt; c.ph+=dt*2;
    if(c.life<=0 || Math.hypot(c.x-B.x,c.y-B.y)>DESP){ S.chests.splice(i,1); continue; }
    if(Math.hypot(c.x-B.x,c.y-B.y)<36){ S.chests.splice(i,1); openChest(); }
  }
}
function updateSchools(dt){
  const B=S.boat, lr=stat.lureR(), lf=stat.lureF();
  for(const s of S.schools){
    if(s.gulls) for(const gu of s.gulls) gu.a+=gu.w*dt;
    s.turn=clamp(s.turn+rnd(-1,1)*dt*2.6,-0.7,0.7);
    s.ang+=s.turn*dt;
    s.pulse+=dt*1.7;
    const sp=s.sp*(1+0.18*Math.sin(s.pulse));
    let tx=Math.cos(s.ang), ty=Math.sin(s.ang), react=0;
    const dx=B.x-s.cx, dy=B.y-s.cy, di=Math.hypot(dx,dy)||1;
    if(lr>0 && di<lr){                          // 集魚：船の方へ舵を切らせる
      const w=lf/12*(1-di/lr);
      tx+=dx/di*w; ty+=dy/di*w; react=Math.max(react,Math.min(1,w/1.4));
    }
    const pdx=s.cx-PORT.x, pdy=s.cy-PORT.y, pd=Math.hypot(pdx,pdy)||1;
    if(pd<SEA.portClear){                       // 港は避ける。岸へ寄った群れは自分から沖へ向き直す
      const w=2.4*(1-pd/SEA.portClear);
      tx+=pdx/pd*w; ty+=pdy/pd*w; react=Math.max(react,Math.min(0.9,w));
    }
    if(di<78){                                  // 逃走：少しだけ進路を変える程度に留める
      const w=1.3*(1-di/78);
      tx-=dx/di*w; ty-=dy/di*w; react=Math.max(react,Math.min(0.35,w));  // 角速度は上げすぎない（周回防止）
    }
    let dh=Math.atan2(ty,tx)-s.hd;
    while(dh>Math.PI) dh-=TAU;
    while(dh<-Math.PI) dh+=TAU;
    // 旋回半径が群れの大きさを下回らないよう角速度を抑える。
    // ただし船に反応しているときは強く曲がってよい
    const wmax=sp/(40+s.rx*1.2)*(1+react*5);
    s.hd+=clamp(dh,-wmax*dt,wmax*dt);
    const c0=Math.cos(s.hd), s0=Math.sin(s.hd);
    s.x+=c0*sp*dt; s.y+=s0*sp*dt;               // 動くのは先頭だけ
    s.pfrac+=sp*dt;
    while(s.pfrac>=PSTEP){                      // 4px進むごとに軌跡を1点刻む
      s.pfrac-=PSTEP; s.pi=(s.pi+1)%PN;
      const b=s.pi*5;
      s.path[b]=s.x; s.path[b+1]=s.y; s.path[b+2]=c0; s.path[b+3]=s0; s.path[b+4]=s.hd;
    }
    const kt=0.28+0.72*Math.sqrt(s.alive/s.n0);
    s.k+=(kt-s.k)*Math.min(1,dt*0.8);
    const k=s.k, P=s.path, pi=s.pi, pf=s.pfrac;
    {                                           // 胴体の中心（判定・影・魚探はここを使う）
      const t=(s.rx*k-pf)/PSTEP;
      const i0=Math.min(PN-2,Math.max(0,t|0)), fr=t-i0;
      const A=(((pi-i0)%PN)+PN)%PN*5, Bb=(((pi-i0-1)%PN)+PN)%PN*5;
      s.cx=P[A]+(P[Bb]-P[A])*fr; s.cy=P[A+1]+(P[Bb+1]-P[A+1])*fr; s.ca=P[A+4];
    }
    const fs=s.fish;   // 魚探に実位置で映すため、画面外の群れも位置を更新する
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      f.ph+=f.ps*dt;
      const w=Math.sin(f.ph);
      const t=(f.d*k+w*2.2-pf)/PSTEP;           // 先頭から何px後ろの軌跡上にいるか
      // t<0 は最新サンプルより前方。i0=0 のまま fr を負にして外挿する
      const i0=Math.min(PN-2,Math.max(0,t|0)), fr=t-i0;
      const A=(((pi-i0)%PN)+PN)%PN*5, Bb=(((pi-i0-1)%PN)+PN)%PN*5;
      const x=P[A]+(P[Bb]-P[A])*fr, y=P[A+1]+(P[Bb+1]-P[A+1])*fr;
      const c=P[A+2]+(P[Bb+2]-P[A+2])*fr, sn=P[A+3]+(P[Bb+3]-P[A+3])*fr;
      const oy=f.oy*k+w*1.3;
      f.wx=x-sn*oy; f.wy=y+c*oy;                // 軌跡の法線方向へ横オフセット
      f.a=P[A+4]+w*0.24;
    }
  }
}

/* ================= 乗組員 ================= */
function layoutCrew(){
  const b=boats[S.up.hull-1];
  S.seats=b.seatX.length*2;
  const onboard=Math.min(S.up.crew,S.seats);
  while(S.crew.length<onboard) S.crew.push({pal:rint(0,2), cd:rnd(0,.7), pose:0, pt:0, row:0, si:0,
    lineLen:rint(8,13), lineSlant:rnd(-2.4,2.4)});
  while(S.crew.length>onboard) S.crew.pop();
  const {q,rem}=rodSplit();                      // 前のほうの rem 人が1本多く持つ
  for(let k=0;k<S.crew.length;k++) S.crew[k].rod = q + (k<rem?1:0);
  S.acc=Math.pow(ACC, rodSplit().over);          // 配りきれなかったぶんは全員の速さへ
  const order=[], ns=b.seatX.length, mid=(ns-1)/2;
  const byCenter=[];
  for(let i=0;i<ns;i++) byCenter.push(i);
  byCenter.sort((a,c)=>Math.abs(a-mid)-Math.abs(c-mid));
  for(const i of byCenter){ order.push([0,i]); order.push([1,i]); }
  for(let k=0;k<S.crew.length;k++){ S.crew[k].row=order[k][0]; S.crew[k].si=order[k][1]; }
  placeCrew();
}
function placeCrew(){
  const b=boats[S.up.hull-1], f=S.boat.face;
  for(const fm of S.crew){
    fm.lx=b.seatX[fm.si]-b.W/2 + (fm.row===1?4:0);
    fm.ly=(fm.row===0?b.railY:b.railY+2)-b.waterY;
    const sp=fsprite(fm);
    fm.wx=f<0?-fm.lx:fm.lx;
    fm.tipx=f<0?-(fm.lx+sp.tip.x):(fm.lx+sp.tip.x);
    fm.tipy=fm.ly+sp.tip.y;
  }
}

/* ================= 漁 ================= */
function netCast(){
  const B=S.boat, N=S.net, R=netR(), Ry=R*NET.flat, take=netTake();
  N.held.length=0;
  for(const s of S.schools){
    if(Math.abs(s.cx-B.x)>R+s.rx*s.k+14 || Math.abs(s.cy-B.y)>Ry+s.rx*s.k+14) continue;
    for(const f of s.fish){
      if(!f.alive) continue;
      const ex=(f.wx-B.x)/R, ey=(f.wy-B.y)/Ry;
      if(ex*ex+ey*ey>1) continue;
      if(Math.random()>take) continue;              // 網目から逃げる
      f.alive=false; s.alive--; S.totalFish--;
      N.held.push({x0:f.wx, y0:f.wy, a:f.a});
    }
  }
  N.phase='pull'; N.t=NET.pull; N.flash=1;
  sfxNet();
}
function netHaul(){
  const N=S.net, n=N.held.length;
  N.held.length=0; N.phase='wait'; N.t=netCycle();
  if(n<=0) return;
  S.hold+=n; S.score+=n; S.prog+=n; S.pop=1;
  bang(n>=120?'chest':'lv'); sfxChest();
  elHaul.classList.remove('go'); void elHaul.offsetWidth;
  elHaul.textContent='+'+fmt(n); elHaul.classList.add('go');
  // 抽選は1匹ごと。まとめて引くので 1-(1-p)^n で1回に畳む
  const p=1-Math.pow(1-fvEntry(), n);
  if(S.fever){ if(Math.random()<p) feverHit(); }
  else if(S.fvLock<=0 && n>=FV_MINFISH && Math.random()<p) feverOn();
  if(S.prog>=S.need) levelUp();
}
function updateNet(dt){
  const B=S.boat, N=S.net, R=netR(), Ry=R*NET.flat;
  let cnt=0;                                        // 囲える魚の数。入れ食いの判定にも使う
  for(const s of S.schools){
    if(Math.abs(s.cx-B.x)>R+s.rx*s.k+14 || Math.abs(s.cy-B.y)>Ry+s.rx*s.k+14) continue;
    for(const f of s.fish){
      if(!f.alive) continue;
      const ex=(f.wx-B.x)/R, ey=(f.wy-B.y)/Ry;
      if(ex*ex+ey*ey<=1) cnt++;
    }
  }
  S.inRange=cnt;
  N.flash=Math.max(0,N.flash-dt*3);
  const want = N.phase==='pull' ? 1 : 0;            // 締めている間は全員が手繰る姿
  if(S.crew.length && S.crew[0].pose!==want){ for(const fm of S.crew) fm.pose=want; placeCrew(); }
  if(navEff()<=0.001) return;                       // 倍速中は網を上げている
  N.t-=dt;
  if(N.t>0) return;
  if(N.phase==='pull') netHaul(); else netCast();
}
function updateTrawl(dt){
  updateTrawlNode(dt);
  const T=S.trawl;
  const ca=Math.cos(T.hd), sa=Math.sin(T.hd);
  const hd2=TR.depth*0.5, hw=trawlW()*0.5;
  const take=trawlTake();
  const back=-hd2+TR.cod;
  const reach=Math.max(hw,hd2)+24;
  let cnt=0;
  /* 魚は網に取り込まない。泳いだまま網の中を相対的に後ろへ流れていき、
     袋の底まで届いたぶんだけ漁獲になる。網が止まれば届かないし、
     振り回せば横から出ていく。目から漏れた個体はそのまま泳ぎ続ける */
  for(const sc of S.schools){
    if(Math.abs(sc.cx-T.x)>reach+sc.rx*sc.k || Math.abs(sc.cy-T.y)>reach+sc.rx*sc.k) continue;
    for(const f of sc.fish){
      if(!f.alive) continue;
      const dx=f.wx-T.x, dy=f.wy-T.y;
      const lx=dx*ca+dy*sa;
      if(lx>hd2 || lx<-hd2){ if(f.slip) f.slip=0; continue; }
      const ly=-dx*sa+dy*ca;
      const u=(hd2-lx)/TR.depth;
      if(Math.abs(ly)>trawlHalfW(u)){ if(f.slip) f.slip=0; continue; }
      cnt++;
      if(lx>back) continue;                      // まだ袋の底に届いていない
      if(f.slip) continue;                       // 目から漏れた個体
      if(Math.random()>take){ f.slip=1; continue; }
      f.alive=false; sc.alive--; S.totalFish--;
      S.score++; S.prog++; S.pop=1;
      if(S.pops.length<64 && Math.random()<.3) S.pops.push({x:f.wx, y:f.wy, t:0, fv:S.fever});
      if(S.fever){
        S.chain++;
        if(Math.random()<fvEntry()) feverHit();
      }
      else if(S.fvLock<=0 && cnt>=FV_MINFISH && Math.random()<fvEntry()) feverOn();
      if(S.prog>=S.need) levelUp();
    }
  }
  S.inRange=cnt;
  const want=((S.rt*4)|0)&1;
  if(S.crew.length && S.crew[0].pose!==want){ for(const fm of S.crew) fm.pose=want; placeCrew(); }
}
function updateFishing(dt){
  if(S.gear==='seine') return updateNet(dt);
  if(S.gear==='trawl') return updateTrawl(dt);
  const B=S.boat, rx=stat.rx(), ry=stat.ry(), eff=navEff();
  const up=[], dn=[];
  let onTori=false;                              // 竿の下に鳥山の魚がいるか
  for(const s of S.schools){
    if(Math.abs(s.cx-B.x)>rx+s.rx*s.k+14 || Math.abs(s.cy-B.y)>ry+s.rx*s.k+14) continue;
    const fs=s.fish, live=s.tori && s.tori.age<TORI.life;
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      const ex=(f.wx-B.x)/rx, ey=(f.wy-B.y)/ry;
      if(ex*ex+ey*ey<=1){ (f.wy<B.y?up:dn).push({f,s}); if(live) onTori=true; }
    }
  }
  S.onTori=onTori;
  const base=BARE*(S.acc||1)*(S.fever?FV_RATE:1)*eff*(onTori?TORI.rate:1);
  S.inRange=up.length+dn.length;                // 竿の下に今いる魚。入れ食いの判定に使う
  if(eff<=0.001) return;                        // 飛ばしすぎ。竿は上がっている
  for(const fm of S.crew){
    if(fm.pose===1){ fm.pt-=dt; if(fm.pt<=0){ fm.pose=0; } }
    fm.cd-=dt;
    if(fm.cd>0) continue;
    const own=fm.row===1?up:dn, other=fm.row===1?dn:up;
    const src=own.length?own:other;
    if(!src.length){ fm.cd=rnd(.03,.12); continue; }
    const fx=B.x+fm.wx;
    let bi=0, bd=1e9;
    for(let i=0;i<src.length;i++){
      const o=src[i], d=Math.abs(o.f.wx-fx)+Math.abs(o.f.wy-B.y)*0.55;
      if(d<bd){ bd=d; bi=i; }
    }
    const o=src[bi]; src.splice(bi,1);
    doCatch(fm,o);
    fm.cd=(1/(base*Math.pow(ROD,fm.rod||0)))*rnd(.82,1.18);
    if(S.mode!=='play') return;
  }
}
function doCatch(fm,o){
  o.f.alive=false; o.s.alive--; S.totalFish--; S.score++; S.prog++; S.hold++;
  fm.pose=1; fm.pt=.28; placeCrew();
  S.parts.push({x:o.f.wx, y:o.f.wy, x0:o.f.wx, y0:o.f.wy, t:0, dur:.28, a:o.f.a, d:o.f.dd, fm});
  S.rings.push({x:o.f.wx, y:o.f.wy, t:0});
  S.pop=1;                                       // ギョカクの数字を弾ませる
  if(S.fever){
    S.chain++;
    if(Math.random()<fvEntry()) feverHit();       // 入れ食い中の当たり。1連増えて時間が戻る
  }
  else if(S.fvLock<=0 && S.inRange>=FV_MINFISH && Math.random()<fvEntry()) feverOn();  // 突入も同じ抽選
  sfxCatch();
  if(S.prog>=S.need) levelUp();
}

/* ================= 入れ食い ================= */
function feverOn(){
  S.fever=true; S.fvT=fvSec(); S.fvRound=1; S.fvPulse=1; S.chain=1;
  S.freeze=FV_STOP;                              // 一瞬だけ世界を止める
  sfxFever(); bang('fever');
  elFvBig.classList.remove('go'); void elFvBig.offsetWidth; elFvBig.classList.add('go');
  clearTimeout(feverOn._t);
  feverOn._t=setTimeout(()=>elFvBig.classList.remove('go'),1150);
}
function fvEntry(){ return FV_ENTRY*(1+FV_SONAR_ODDS*(S.up.sonar-1)); }  // 魚探で当たりやすくなる
function fvSec(){ return FV_SEC + (S.up.lure-1)*FV_LURE_SEC; }          // 集魚で1回が長くなる
function feverHit(){                             // 期間中にもう一度当てた
  S.fvRound++; S.fvT=fvSec(); S.fvPulse=1;
  bang('cont'); sfxSure();
}
function updateFever(dt){
  if(S.fvLock>0) S.fvLock-=dt;
  if(!S.fever) return;
  S.fvT-=dt;
  if(S.fvT>0) return;
  S.fever=false; S.fvT=0; S.fvLock=FV_LOCK;      // 終わりは無音。通常に戻るだけ
  elFvBadge.style.transform='';
}
function bang(kind){                             // 決定的な瞬間の閃光と揺れ
  const big=kind==='fever';
  S.burst={t:0, dur:big?.7:(kind==='cont'?.34:(kind==='chest'?.55:.45)), kind, seed:rnd(0,TAU)};
  S.shake=Math.min(big?1.35:1, S.shake+(big?1.35:(kind==='cont'?.45:(kind==='chest'?.8:1))));
}

/* ================= 強化 ================= */
function rollChoices(){
  const pool=UPG.filter(u=>u.lv()<u.max), out=[];
  while(out.length<3 && pool.length) out.push(pool.splice(rint(0,pool.length-1),1)[0]);
  while(out.length<3) out.push(UPG_BY.crew);
  return out;
}
/* run 中に強化は起きない。考えることは島に隔離してある（一本釣りとの一番の違い）。
   呼び出し側の `if(S.prog>=S.need) levelUp()` はそのまま残し、ここで握り潰している */
function levelUp(){ S.prog=0; }
function applyUpgrade(u){ u.apply(); layoutCrew(); }
function dropChest(){                            // 魚探を積んだ瞬間に1つ流れ着く
  // 画面の外（対角で275px）に出す。魚探に映らないと探しようがないので範囲内には収める
  const B=S.boat, a=rnd(0,TAU), d=Math.min(rnd(300,420), Math.max(300, stat.sonar()));
  S.chests.push({x:B.x+Math.cos(a)*d, y:B.y+Math.sin(a)*d, life:52, ph:rnd(0,TAU)});
}
/* 宝箱は漂流物なので、魚ではなく金が直接入る。
   積荷と違って燃料切れで半値にならないぶん、拾いに行く価値がある。
   当たりの重みは一本釣りの 70/23/7% をそのまま流用した */
const CHEST_YEN=[2000,6000,15000];
/* 船の段階（造船所Lv）ごとの宝箱の倍率。固定額だと序盤しか嬉しくないので、稼ぎの桁に合わせて増やす */
const CHEST_MUL=[1,8,40,150,300];
function openChest(){
  const r=Math.random(), i = r<.70?0:(r<.93?1:2);
  const n=CHEST_YEN[i]*CHEST_MUL[S.fac.ship];
  S.money+=n;
  saveGame();                                   // 航海の途中で閉じても消えないように
  bang('chest'); sfxChest();
  toastEl.querySelector('.hd').textContent = t(i===2?'chest.5':(i===1?'chest.3':'chest.1'));
  toastItems.innerHTML='';
  {
    const d=document.createElement('div'); d.className='it';
    d.textContent = yen(n);
    toastItems.appendChild(d);
  }
  toastEl.classList.add('on');
  clearTimeout(openChest._t);
  openChest._t=setTimeout(()=>toastEl.classList.remove('on'),2600);
}

/* ================= 港と航海 ================= */
/* SEA -> DOCKING -> PORT -> DEPARTING -> SEA。操船できるのは SEA のときだけ */
function dockPos(){
  const len=HULL_LEN[S.up.hull-1]||52, shift=Math.max(0, len/2-PORT.berth);
  return {x:PORT.x+PORT.dock.x+shift, y:PORT.y+PORT.dock.y};
}
function portView(){
  const d=dockPos(), bow=d.x+(HULL_LEN[S.up.hull-1]||52)/2;
  return {x:PORT.x+PORT.view.x+Math.max(0,bow-PORT.viewRight), y:PORT.y+PORT.view.y};
}
/* 入港の判定は島の中心ではなく船着場から測る。島まるごとを円で囲うと、
   岸に沿って走っているだけで操船を取り上げられてしまう */
function dockDist(){ const d=dockPos(); return Math.hypot(S.boat.x-d.x, S.boat.y-d.y); }
function inPortArea(){ return dockDist()<PORT.r; }

function updateVoyage(dt){
  if(S.phase==='sea'){
    const sp=S.boat.sp, cruise=Math.max(1,stat.speed());
    const over=clamp((sp/cruise-1)/(NAV_BOOST-1),0,1);      // 0=巡航 1=倍速
    const cruiseBurn=stat.speed()*FUEL.perPx;               // 巡航1秒ぶんの消費
    S.fuel-=sp*dt*FUEL.perPx*(1+FUEL.boostPenalty*over) + cruiseBurn*FUEL.idleRate*dt;
    if(S.fuel<=0){ S.fuel=0; beginReturn(); }    // 燃料切れ。罰は無く、暗転して港へ戻るだけ
    else if(inPortArea() && S.voyage>0) beginDocking();
    return;
  }
  if(S.phase==='docking' || S.phase==='departing'){
    const B=S.boat;
    let tx,ty;
    if(S.phase==='docking'){ const d=dockPos(); tx=d.x; ty=d.y; }
    else { const dk=dockPos(); tx=dk.x+PORT.out+40; ty=dk.y; }
    const dx=tx-B.x, dy=ty-B.y, d=Math.hypot(dx,dy);
    const step=Math.min(d, PORT.approach*dt);
    if(d>0.001){ B.x+=dx/d*step; B.y+=dy/d*step; B.hd=Math.atan2(dy,dx); B.face=dx>0?1:-1; }
    B.sp=PORT.approach; B.vx=dx/(d||1)*B.sp; B.vy=dy/(d||1)*B.sp; B.bob+=dt*2.4; placeCrew();
    if(S.phase==='docking' && d<2.5){ B.sp=0; B.vx=0; B.vy=0; arrivePort(); }
    if(S.phase==='departing' && dockDist()>PORT.out){ B.sp=0; S.phase='sea'; }
  }
}
/* 0=船に貼りつく 1=島を見る。
   時間で補間せず、点線の円のどこに船が居るかをそのまま使う。
   円の縁で0、船着場で1。つまり船が円の中を動いている間だけカメラが動き、
   速く入れば速く寄る。航海中は必ず0なのでカメラが船から遅れることはない */
function updateCam(dt){
  if(S.phase==='sea'){ S.camK=0; return; }
  if(S.phase==='port'||S.phase==='landing'){ S.camK=1; return; }   // 着岸は2px手前で止まるので締めておく
  if(S.phase==='returning'){ S.camK=S.ret&&S.ret.moved?1:0; return; }
  S.camK = clamp(1-dockDist()/PORT.r, 0, 1);
}
function camPos(){
  const B=S.boat, k=S.camK;
  const v=portView();
  return {x:B.x+(v.x-B.x)*k, y:B.y+(v.y-B.y)*k};
}
/* 燃料切れ、またはメニューの「港へ戻る」。短く暗転して港に着け、そのまま水揚げする。
   帰るための燃料を残しておく必要は無い */
const RET={fade:0.35, hold:0.15};   // 暗くなるまで・真っ暗のまま・明けるまでの秒数（明けも fade）
function beginReturn(){
  if(S.phase!=='sea') return;
  S.phase='returning'; S.ret={t:0, moved:false};
  S.fever=false; S.fvT=0; S.fvRound=0;
  S.dir.x=0; S.dir.y=0; S.dir.t=1; S.stick.id=-1; S.stick.on=false;
}
function updateReturn(dt){
  const R=S.ret; if(!R) return;
  R.t+=dt;
  if(!R.moved && R.t>=RET.fade){               // 真っ暗なあいだに船着場へ移す
    const d=dockPos(), B=S.boat;
    B.x=d.x; B.y=d.y; B.sp=0; B.vx=0; B.vy=0; B.face=-1; B.hd=Math.PI;
    placeCrew(); R.moved=true;
  }
  if(R.t>=RET.fade*2+RET.hold){ S.ret=null; arrivePort(); }
}
function retAlpha(){
  const R=S.ret; if(!R) return 0;
  const a=RET.fade, h=RET.hold, t=R.t;
  return t<a ? t/a : (t<a+h ? 1 : Math.max(0,1-(t-a-h)/a));
}
function beginDocking(){
  S.phase='docking';
  S.fever=false; S.fvT=0; S.fvRound=0;
  S.dir.x=0; S.dir.y=0; S.dir.t=1;
  S.stick.id=-1; S.stick.on=false;
}
/* 着岸したら、水揚げ・換金・給油をまとめて自動でやる（仕様12） */
/* 水揚げ。着岸したらすぐ港の画面へ行かず、釣った本数ぶん魚を跳ねさせて金に変える。
   数字が一瞬で増えるより、粒が出きるのを見ているほうが手応えが残る */
const HAUL={
  sec:3.0,          // 全体の秒数
  fly:0.5,          // 船から水揚げ場まで飛ぶ秒数
  flyVar:0.22,      // 飛行時間のばらつき。揃いすぎると1本の線に見える
  arc:52,           // 放物線の高さ
  fromX:0.40,       // 出る位置。船の長さに対する割合（船首と船尾いっぱいまでで0.5）
  fromY:-3,         // 舷からの上下。B.y は喫水なので、舷の高さを引いてから足す
  spin:12,          // 飛んでいる間の回転
  noteSec:0.42,     // 札束が出てから消えるまで
  noteRise:24,      // 札束が浮き上がる高さ
  maxPops:200,      // 出す粒の上限。これを超える釣果は1粒が複数匹ぶんになる。
                    // 増やしすぎると弧が白い帯になって、魚が1匹ずつ見えなくなる
  sfxPerSec:16      // 音は間引く。粒の数だけ鳴らすと潰れる
};
function arrivePort(){
  const fish=S.hold, yen=Math.round(fish*fishYen());   // 売値は水産加工場のLvで上がる
  S.fuel=fuelMax();
  S.landed={fish, yen};
  S.phase='landing';
  S.land={t:0, fish, yen, money0:S.money, pops:0, done:0, sfxT:0,
          n:Math.min(HAUL.maxPops, Math.max(1,fish))};
  S.parts2.length=0;
  elHaul.classList.remove('go'); elHaul.classList.add('on');
  if(fish<=0) finishLanding();
}
function finishLanding(){
  const L=S.land;
  if(L){ S.money=L.money0+L.yen; }
  S.hold=0; S.land=null; S.parts2.length=0;
  elHaul.classList.remove('on'); elHaul.textContent='';
  S.phase='port';
  saveGame();
  showPort();
  sfxChest();
}
function haulEmitSec(){
  return Math.max(0.3, HAUL.sec - HAUL.fly*(1+HAUL.flyVar) - HAUL.noteSec);
}
function updateLanding(dt){
  const L=S.land; if(!L) return;
  L.t+=dt;
  const B=S.boat, b=boats[S.up.hull-1];
  const u=clamp(L.t/haulEmitSec(),0,1);
  const want=Math.round(L.n*u);
  let make=want-L.pops;
  L.pops=want;
  L.sfxT-=dt;
  const mx=PORT.x+PORT.market.x, my=PORT.y+PORT.market.y;
  while(make-->0){
    /* B.y は喫水線。そのまま使うと船底から湧いて見えるので、舷の高さまで上げる */
    const deck=B.y-(b.waterY-b.railY)+HAUL.fromY;
    S.parts2.push({
      x0:B.x+rnd(-b.len*HAUL.fromX,b.len*HAUL.fromX), y0:deck+rnd(-2,2),
      x1:mx+rnd(-7,7), y1:my+rnd(-4,4),
      t:0, dur:HAUL.fly*rnd(1-HAUL.flyVar,1+HAUL.flyVar),
      arc:HAUL.arc*rnd(0.75,1.25),
      a:rnd(0,TAU), av:rnd(-HAUL.spin,HAUL.spin),
      ph:0, x:0, y:0
    });
    if(L.sfxT<=0){ L.sfxT=1/HAUL.sfxPerSec; tone(760+rnd(-60,220),.05,'square',.032,1.6); }
  }
  /* 数字は「飛ばした数」ではなく「水揚げ場に着いた数」で動かす。
     でないと札束が出るより先に金が増えて、因果が逆に見える */
  const done=L.done/Math.max(1,L.n);
  S.money=L.money0+Math.round(L.yen*done);
  S.hold=Math.round(L.fish*(1-done));
  setTxt(elHaul, yen(S.money-L.money0));
  if(L.t>=HAUL.sec) finishLanding();
}
function updateParts2(dt){
  const L=S.land;
  for(let i=S.parts2.length-1;i>=0;i--){
    const p=S.parts2[i]; p.t+=dt;
    if(p.ph===0){
      const u=p.t/p.dur;
      if(u>=1){                                  // 水揚げ場に着いた。札束になる
        p.ph=1; p.t=0; p.x=p.x1; p.y=p.y1;
        if(L) L.done++;
        continue;
      }
      p.x=p.x0+(p.x1-p.x0)*u;
      p.y=p.y0+(p.y1-p.y0)*u-4*p.arc*u*(1-u);    // 放物線
      p.a+=p.av*dt;
    }else if(p.t>=HAUL.noteSec){
      S.parts2.splice(i,1);
    }
  }
}
function drawLanding(){
  if(!S.parts2.length) return;
  const ox=OX, oy=OY, k=1/TAU*ANG;
  for(const p of S.parts2){
    if(p.ph===0){
      const x=Math.round(p.x+ox), y=Math.round(p.y+oy);
      const ai=((Math.round(p.a*k)%ANG)+ANG)%ANG;
      ctx.drawImage(fishAtlas, ai*CELL, 3*CELL, CELL, CELL, (x-CELL/2)|0, (y-CELL/2)|0, CELL, CELL);
    }else{
      const u=p.t/HAUL.noteSec;
      const x=Math.round(p.x+ox), y=Math.round(p.y+oy-HAUL.noteRise*Math.sqrt(u));
      if(u<0.2){                                   // 変わった瞬間の閃光
        ctx.globalAlpha=1-u/0.2;
        ctx.fillStyle='#fff6dd';
        ctx.fillRect(x-7,y+4,15,1); ctx.fillRect(x,y-3,1,15);
        ctx.globalAlpha=1;
      }
      ctx.globalAlpha=u>0.6?(1-u)/0.4:1;
      ctx.drawImage(noteCv, x-6, y-4);
      ctx.globalAlpha=1;
    }
  }
}
function departPort(){
  if(S.phase!=='port') return;
  hidePort();
  S.voyage++;
  S.npcYen=0;
  S.phase='departing';
  S.toriT=rnd(TORI.first[0],TORI.first[1]);
  S.landed=null;
  audioInit();
  saveGame();
}

/* ================= NPC漁船 =================
   自分の船に乗り切れない住民が、自分が乗り換える前の段階の船（木造の小舟・漁船・大型漁船）に
   適当に分乗して漁に出る。港の東の停泊位置から出港し、持ち場（港からの輪）の中で群れを探して
   追いかけ、自分の船と同じ判定で釣る。船倉が満杯になるか、帰る分の燃料しか残らなくなったら
   港へ戻って売り（所持金に入る）、給油して少し休んでまた出る。
   群れは船のまわりにしか湧かないので、NPC船のまわりにも少しだけ群れを湧かせる（manageWorld）。
   港で待っている間に稼がないよう、NPC船が動くのは自分が航海に出ているあいだだけ */
const NPC={
  /* art は船の絵、ring は持ち場（港からの距離 px）、hold は船倉、fuel は航続（px）。
     stage は造船所のLv。自分がそれより大きい船に乗り換えたら、その船がNPCに回る */
  types:[
    {stage:0, art:6, seats:8,  ring:[500,1400], speed:34, hold:300,  fuel:5000},   // 木造の小舟
    {stage:1, art:3, seats:18, ring:[700,2400], speed:40, hold:900,  fuel:9000},   // 漁船
    {stage:2, art:5, seats:32, ring:[900,3600], speed:46, hold:2500, fuel:16000}   // 大型漁船
  ],
  fill:[0.6,1.0],     // 1隻にどれだけ乗せるか（席に対する割合）
  max:10,             // NPC船の上限
  schools:4,          // NPC船1隻のまわりに保つ群れの数。自分の船のまわり（14〜28）より少なく
  reach:700,          // この距離までの群れを追いかける
  rest:[3,7],         // 港で休む秒数
  reserve:1.3,        // 港までの距離のこの倍の燃料を残したら帰る
  berth:{x0:130, x1:280, y0:-150, y1:150}   // 港の東側の停泊場所（港からの相対 px）
};
/* 島を横切らないための回り道。まっすぐ行くと陸をかすめるなら、陸の角を1つ経由する */
function segHitsRect(ax,ay,bx,by,L){
  if(Math.max(ax,bx)<L.x0||Math.min(ax,bx)>L.x1||Math.max(ay,by)<L.y0||Math.min(ay,by)>L.y1) return false;
  for(let k=0;k<=24;k++){ const u=k/24, x=ax+(bx-ax)*u, y=ay+(by-ay)*u;
    if(x>L.x0&&x<L.x1&&y>L.y0&&y<L.y1) return true; }
  return false;
}
function npcRoute(nb,tx,ty){
  const L0=landRect(), m=nb.b.len/2+30, L={x0:L0.x0-m,y0:L0.y0-m,x1:L0.x1+m,y1:L0.y1+m};
  if(!segHitsRect(nb.x,nb.y,tx,ty,L)) return [tx,ty];
  const cs=[[L.x0-4,L.y0-4],[L.x1+4,L.y0-4],[L.x0-4,L.y1+4],[L.x1+4,L.y1+4]];
  let best=null, bd=1e18;
  for(const [cx,cy] of cs){
    if(segHitsRect(nb.x,nb.y,cx,cy,L)) continue;
    const d=Math.hypot(cx-nb.x,cy-nb.y)+Math.hypot(tx-cx,ty-cy);
    if(d<bd){ bd=d; best=[cx,cy]; }
  }
  return best||[tx,ty];
}
/* 住民の余りから船団を組み直す。施設を上げたときと読み込んだときに呼ぶ（港にいるとき） */
function buildFleet(){
  for(const nb of S.npcs||[]) if(nb.hold>0) S.money+=Math.round(nb.hold*fishYen());   // 積んでいた分は売っておく
  const surplus=Math.max(0, population()-S.up.crew);
  const avail=NPC.types.filter(t=>t.stage<S.fac.ship);      // 乗り換える前の段階の船だけ
  const R=seeded(surplus*7919+S.fac.ship*31+1);
  const out=[]; let left=avail.length?surplus:0;
  const pick=T=>{ const n=Math.min(left, T.seats, Math.max(1, Math.round(T.seats*(NPC.fill[0]+(NPC.fill[1]-NPC.fill[0])*R()))));
    out.push(makeNpc(T,n,R,out.length)); left-=n; };
  if(left>0) pick(avail[avail.length-1]);                    // 1隻目は乗り換える直前の船
  while(left>0 && out.length<NPC.max){
    const fit=avail.filter(t=>t.seats*NPC.fill[0]<=left);
    const pool=fit.length?fit:[avail[0]];
    pick(pool[Math.floor(R()*pool.length)]);
  }
  S.npcs=out;
}
function makeNpc(T,n,R,idx){
  const b=boats[T.art-1], bz=NPC.berth;
  const bx=PORT.x+bz.x0+(bz.x1-bz.x0)*R(), by=PORT.y+bz.y0+(bz.y1-bz.y0)*((idx*0.37+R()*0.3)%1);
  const nb={T, b, n, x:bx, y:by, bx, by, hd:0, face:1, sp:0, state:'dock', t:rnd(NPC.rest[0],NPC.rest[1]),
    tx:bx, ty:by, hold:0, fuel:T.fuel*(1+FAC_EFF.tank*S.fac.tank), bob:R()*TAU, crew:[], tgt:null};
  const ns=b.seatX.length, mid=(ns-1)/2, byC=[];
  for(let i=0;i<ns;i++) byC.push(i);
  byC.sort((p,q)=>Math.abs(p-mid)-Math.abs(q-mid));
  const order=[]; for(const i of byC){ order.push([0,i]); order.push([1,i]); }
  const rodsPer=FAC_EFF.gear*S.fac.gear;                     // 竿は自分の船と同じ配り方（1人最大3本）
  for(let k=0;k<n && k<order.length;k++){
    const fm={pal:Math.floor(R()*3), pose:0, pt:0, row:order[k][0], si:order[k][1], cd:rnd(0,.7),
              rod:Math.min(ROD_MAX, Math.floor(rodsPer)+(R()<rodsPer%1?1:0))};
    fm.lx=b.seatX[fm.si]-b.W/2+(fm.row===1?4:0);
    fm.ly=(fm.row===0?b.railY:b.railY+2)-b.waterY;
    nb.crew.push(fm);
  }
  return nb;
}
function npcFuelMax(nb){ return nb.T.fuel*(1+FAC_EFF.tank*S.fac.tank); }
function npcWander(nb){                                       // 持ち場の輪の中で、次に探しに行く場所
  const cur=Math.atan2(nb.y-PORT.y, nb.x-PORT.x), T=nb.T;
  const a=(nb.state==='out'&&Math.hypot(nb.x-PORT.x,nb.y-PORT.y)<T.ring[0]) ? rnd(-1.2,1.2) : cur+rnd(-0.6,0.6);
  const r=rnd(T.ring[0],T.ring[1]);
  nb.tx=PORT.x+Math.cos(a)*r; nb.ty=PORT.y+Math.sin(a)*r;
}
function npcOnScreen(nb){ return Math.abs(nb.x-camX)<VW/2+nb.b.W && Math.abs(nb.y-camY)<VH/2+nb.b.H; }
/* 自分の船と同じ判定で釣る。竿の下（楕円）にいる魚を、漁師ごとの間隔で1匹ずつ */
function npcFish(nb,dt){
  if(nb.hold>=nb.T.hold) return 0;
  const rx=nb.b.len/2+24, ry=42, up=[], dn=[];
  for(const s of S.schools){
    if(Math.abs(s.cx-nb.x)>rx+s.rx*s.k+14 || Math.abs(s.cy-nb.y)>ry+s.rx*s.k+14) continue;
    const fs=s.fish;
    for(let i=0;i<fs.length;i++){ const f=fs[i]; if(!f.alive) continue;
      const ex=(f.wx-nb.x)/rx, ey=(f.wy-nb.y)/ry;
      if(ex*ex+ey*ey<=1) (f.wy<nb.y?up:dn).push({f,s}); }
  }
  if(!up.length && !dn.length) return 0;
  const vis=npcOnScreen(nb); let got=0;
  for(const fm of nb.crew){
    fm.cd-=dt; if(fm.cd>0) continue;
    const own=fm.row===1?up:dn, other=fm.row===1?dn:up, src=own.length?own:other;
    if(!src.length){ fm.cd=rnd(.03,.12); continue; }
    const fx=nb.x+(nb.face<0?-fm.lx:fm.lx);
    let bi=0, bd=1e9;
    for(let i=0;i<src.length;i++){ const d=Math.abs(src[i].f.wx-fx)+Math.abs(src[i].f.wy-nb.y)*0.55; if(d<bd){bd=d;bi=i;} }
    const o=src[bi]; src.splice(bi,1);
    o.f.alive=false; o.s.alive--; S.totalFish--; nb.hold++; got++;
    fm.cd=(1/(BARE*Math.pow(ROD,fm.rod||0)))*rnd(.82,1.18);
    if(vis){ fm.pose=1; fm.pt=.28;
      if(S.pops.length<64){ const sp=fsprite(fm), tx=nb.face<0?-(fm.lx+sp.tip.x):(fm.lx+sp.tip.x);
        S.pops.push({x:nb.x+tx, y:nb.y+fm.ly+sp.tip.y, t:0, fv:false}); } }
    if(nb.hold>=nb.T.hold) break;
  }
  return got;
}
function npcSteer(nb,dt,tx,ty,speed){
  const [wx,wy]=npcRoute(nb,tx,ty);
  let dh=Math.atan2(wy-nb.y,wx-nb.x)-nb.hd;
  while(dh>Math.PI) dh-=TAU; while(dh<-Math.PI) dh+=TAU;
  nb.hd+=clamp(dh,-1.4*dt,1.4*dt);
  nb.sp+=(speed-nb.sp)*(1-Math.pow(0.1,dt));
  return Math.hypot(tx-nb.x,ty-nb.y);
}
function updateNpcs(dt){
  if(S.phase!=='sea') return;                                 // 自分が航海に出ているあいだだけ動く
  for(const nb of S.npcs){
    nb.bob+=dt*2.4;
    for(const fm of nb.crew) if(fm.pose===1){ fm.pt-=dt; if(fm.pt<=0) fm.pose=0; }
    const home=Math.hypot(nb.x-nb.bx, nb.y-nb.by);
    if(nb.state==='dock'){
      nb.sp*=Math.pow(0.1,dt); nb.t-=dt;
      if(nb.t<=0){ nb.state='out'; npcWander(nb); }
    }else if(nb.state==='home'){
      const d=npcSteer(nb,dt,nb.bx,nb.by,nb.T.speed*(home<80?0.5:1));
      if(d<10){                                               // 着いた。売って給油して休む
        if(nb.hold>0){ const y=Math.round(nb.hold*fishYen()); S.money+=y; S.npcYen=(S.npcYen||0)+y; S.npcFish=(S.npcFish||0)+nb.hold; }
        nb.hold=0; nb.fuel=npcFuelMax(nb); nb.state='dock'; nb.t=rnd(NPC.rest[0],NPC.rest[1]); nb.sp=0; nb.tgt=null;
      }
    }else{                                                    // 'out'：探す・追う・釣る
      let tgt=nb.tgt;
      if(!tgt || tgt.alive<8 || !S.schools.includes(tgt) || Math.hypot(tgt.cx-nb.x,tgt.cy-nb.y)>NPC.reach*1.4){
        tgt=null; let bd=NPC.reach;
        for(const s of S.schools){ if(s.alive<8) continue;
          const r=Math.hypot(s.cx-PORT.x,s.cy-PORT.y); if(r>nb.T.ring[1]+300) continue;
          const d=Math.hypot(s.cx-nb.x,s.cy-nb.y)-s.rx*s.k; if(d<bd){bd=d;tgt=s;} }
        nb.tgt=tgt;
      }
      if(tgt){
        const d=Math.hypot(tgt.cx-nb.x,tgt.cy-nb.y)-tgt.rx*tgt.k;
        npcSteer(nb,dt,tgt.cx,tgt.cy,nb.T.speed*(d<20?0.45:1));   // 乗ったら緩める
      }else if(npcSteer(nb,dt,nb.tx,nb.ty,nb.T.speed)<30) npcWander(nb);
      npcFish(nb,dt);
      if(nb.hold>=nb.T.hold || nb.fuel<=home*FUEL.perPx*NPC.reserve) nb.state='home';
    }
    if(nb.state!=='dock'){                                    // 燃料は自分の船と同じく走った距離と停船で減る
      nb.fuel-=nb.sp*dt*FUEL.perPx + nb.T.speed*FUEL.perPx*FUEL.idleRate*dt;
      if(nb.fuel<=0){ nb.x=nb.bx; nb.y=nb.by; nb.state='home'; nb.fuel=0; }   // 切れたら港へ曳かれて戻る
    }
    nb.x+=Math.cos(nb.hd)*nb.sp*dt; nb.y+=Math.sin(nb.hd)*nb.sp*dt;
    const c=Math.cos(nb.hd); if(nb.sp>3 && Math.abs(c)>0.2) nb.face=c>0?1:-1;
  }
}

/* ================= 船 ================= */
function updateBoat(dt){
  const B=S.boat, sp=stat.speed();
  let tx=0,ty=0;
  tx=S.dir.x; ty=S.dir.y;
  const want=Math.hypot(tx,ty);
  const cruise=sp*clamp(S.dir.t==null?1:S.dir.t, 0, NAV_BOOST);
  if(want>0){                             // 船首方位は最小旋回半径に縛られる
    let dh=Math.atan2(ty,tx)-B.hd;
    while(dh>Math.PI) dh-=TAU;
    while(dh<-Math.PI) dh+=TAU;
    const wmax=stat.turn()*(0.6+0.4*Math.min(NAV_BOOST,B.sp/Math.max(1,sp)));   // 停船中はやや舵が鈍る
    B.hd+=clamp(dh,-wmax*dt,wmax*dt);
  }
  const target=want>0?cruise:0;           // 推力は船首方向のみ。横滑りはしない
  B.sp+=(target-B.sp)*(1-Math.pow(target>B.sp?BOAT_ACC:BOAT_DEC, dt));   // 止まるときだけ粘る
  B.vx=Math.cos(B.hd)*B.sp; B.vy=Math.sin(B.hd)*B.sp;
  B.x+=B.vx*dt; B.y+=B.vy*dt;
  keepOffLand();
  if(Math.abs(B.vx)>4) B.face=B.vx>0?1:-1;
  B.bob+=dt*2.4;
  placeCrew();
  const b=boats[S.up.hull-1];
  // 航跡
  const spd=Math.hypot(B.vx,B.vy);
  const boost=navBoost();
  if(spd>8 && Math.random()<dt*(boost?110:38)){
    const back=-B.face*(b.len/2);
    S.wake.push({x:B.x+back+rnd(-6,6), y:B.y+rnd(-3,4), t:0, r:boost?rnd(2,4.5):rnd(1,2.4)});
  }
  if(boost){
    // 倍速中は竿を上げている。代わりに舳先が盛大に割れる
    S.sprayAcc+=120*dt;
    let n=Math.min(12,Math.floor(S.sprayAcc)); S.sprayAcc-=n;
    const fx=B.face*(b.len/2-2);
    while(n-->0){
      const side=Math.random()<.5?-1:1;
      S.spray.push({x:B.x+fx+rnd(-3,3), y:B.y+rnd(-1,2), big:1,
        vx:B.face*rnd(12,40)+rnd(-8,8), vy:side*rnd(12,30), t:0, life:rnd(.35,.7)});
    }
  }else{
    // 散水（活餌を撒く仕掛け）
    S.sprayAcc+=S.crew.length*6*dt;
    let n=Math.min(6,Math.floor(S.sprayAcc));
    S.sprayAcc-=n;
    while(n-->0 && S.crew.length){
      const fm=pick(S.crew);
      S.spray.push({x:B.x+fm.wx+rnd(-2,2), y:B.y+fm.ly+1,
        vx:rnd(-6,6), vy:(fm.row===0?1:-1)*rnd(16,30), t:0, life:rnd(.3,.55)});
    }
  }
}

/* ================= パーティクル ================= */
function updateParts(dt){
  const B=S.boat;
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i]; p.t+=dt;
    const u=p.t/p.dur;
    if(u>=1){
      S.flash.push({fm:p.fm, t:0});
      if(S.pops.length<64) S.pops.push({x:B.x+p.fm.tipx, y:B.y+p.fm.tipy, t:0, fv:S.fever});
      S.parts.splice(i,1); continue;
    }
    const tx=B.x+p.fm.tipx, ty=B.y+p.fm.tipy;
    p.x=p.x0+(tx-p.x0)*u;
    p.y=p.y0+(ty-p.y0)*u - Math.sin(u*Math.PI)*14;
    p.a+=dt*10;
  }
  for(let i=S.rings.length-1;i>=0;i--){ const r=S.rings[i]; r.t+=dt; if(r.t>.36) S.rings.splice(i,1); }
  for(let i=S.flash.length-1;i>=0;i--){ const f=S.flash[i]; f.t+=dt; if(f.t>.16) S.flash.splice(i,1); }
  for(let i=S.pops.length-1;i>=0;i--){ const p=S.pops[i]; p.t+=dt; if(p.t>.55) S.pops.splice(i,1); }
  for(let i=S.wake.length-1;i>=0;i--){ const w=S.wake[i]; w.t+=dt; if(w.t>1.1) S.wake.splice(i,1); }
  for(let i=S.spray.length-1;i>=0;i--){
    const s=S.spray[i]; s.t+=dt;
    if(s.t>s.life){ S.spray.splice(i,1); continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy*=0.94;
  }
  for(let i=S.boil.length-1;i>=0;i--){ const b=S.boil[i]; b.t+=dt; if(b.t>b.life) S.boil.splice(i,1); }
  spawnBoil(dt);
}
/* 入れ食い中だけ、群れが水面で跳ねる（ナブラ）。判定には一切関わらない */
const BOIL_MAX=160, BOIL_RATE=340;   // 同時に出る上限と、1秒あたりに跳ねる数
const BOIL_R=120;                    // 船からこの距離までの魚だけが跳ねる（縦は海の見え方に合わせて潰す）
function spawnBoil(dt){
  if(!S.fever || S.boil.length>=BOIL_MAX) return;
  const B=S.boat;
  S.boilAcc += dt*(REDUCE?BOIL_RATE*0.3:BOIL_RATE);
  let n=S.boilAcc|0; if(n<=0) return;
  S.boilAcc-=n;
  const cand=[], ry=BOIL_R*.62;
  for(const s of S.schools){
    if(s.alive<=0) continue;
    const reach=s.rx*s.k+BOIL_R;
    if(Math.abs(s.cx-B.x)>reach || Math.abs(s.cy-B.y)>reach) continue;
    const fs=s.fish;
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      const ex=(f.wx-B.x)/BOIL_R, ey=(f.wy-B.y)/ry;
      if(ex*ex+ey*ey<=1) cand.push(f);
    }
  }
  if(!cand.length) return;
  while(n-->0 && S.boil.length<BOIL_MAX){
    const f=cand[rint(0,cand.length-1)];
    S.boil.push({x:f.wx+rnd(-2,2), y:f.wy+rnd(-1,1), t:0, life:rnd(.26,.42), k:rnd(.7,1.25), d:Math.random()<.5?1:-1});
  }
}

<script>
"use strict";
/* ================= 描画 ================= */
let patDeep=null, patSurf=null, topGrad=null, bobPx=0;
function initPatterns(){
  patDeep=ctx.createPattern(seaDeep,'repeat');
  patSurf=ctx.createPattern(seaSurf,'repeat');
  topGrad=ctx.createLinearGradient(0,0,0,VH);
  topGrad.addColorStop(0,'rgba(150,214,238,.07)');
  topGrad.addColorStop(.55,'rgba(6,40,62,0)');
  topGrad.addColorStop(1,'rgba(2,14,24,.22)');
}
/* 揺れたぶんの余白まで塗る。タイルは64pxなので余白も64の倍数にする */
const SEA_PAD=64;
function drawSea(){
  ctx.save();
  ctx.translate(-(((camX*.55)%64)+64)%64, -(((camY*.55)%64)+64)%64);
  ctx.fillStyle=patDeep; ctx.fillRect(-SEA_PAD,-SEA_PAD,VW+64+SEA_PAD*2,VH+64+SEA_PAD*2);
  ctx.restore();
  ctx.save();
  const dx=camX-S.t*8, dy=camY-S.t*2.5;
  ctx.translate(-((dx%64)+64)%64, -((dy%64)+64)%64);
  ctx.fillStyle=patSurf; ctx.fillRect(-SEA_PAD,-SEA_PAD,VW+64+SEA_PAD*2,VH+64+SEA_PAD*2);
  ctx.restore();
  ctx.fillStyle=topGrad; ctx.fillRect(-SEA_PAD,-5,VW+SEA_PAD*2,VH+10);   // 揺れたぶんの余白まで塗る
}
/* ================= ワールド→画面 =================
   変換はここ1か所だけ。draw() の頭で setCam() を1回呼び、
   各描画は  const ox=OX, oy=OY;  と受けて  world + ox  で画面座標になる。
   船に付いているもの（竿・糸・網・閃光）は boatSX/boatSY を基準にする。

   VW/2 を直に書くと「船は常に画面中央」を前提にしてしまい、
   カメラが島へ寄ったときにそれだけ置いていかれる。実際それで釣り糸が取り残され、
   画面外判定が船基準のままで端の魚が消えた。書くならここだけ。 */
let camX=0, camY=0;      // カメラのワールド座標
let OX=0, OY=0;          // ワールド座標に足すと画面座標になる
function setCam(){ const c=camPos(); camX=c.x; camY=c.y; OX=VW/2-camX; OY=VH/2-camY; }
function boatSX(){ return S.boat.x+OX; }
function boatSY(){ return S.boat.y+OY; }

/* 港。海の上に1枚置くだけ。世界の原点に船着場が来るよう左上を逆算する */
function drawPort(){
  const B=S.boat, ox=OX, oy=OY;
  const o=portOrigin();
  const x=o.x+ox, y=o.y+oy;
  if(x>VW||y>VH||x+PORT_W<0||y+PORT_H<0) return;
  ctx.drawImage(portCv, x|0, y|0);
}
/* 港が画面の外に出ているあいだ、画面の縁に方角を出す（仕様9）。
   海図もミニマップも出さない。これだけを頼りに戻る */
/* 港に着いている間、合わせている建物と開いている建物に枠を出す。
   押せる場所がどこかは、文字ではなくこれで分かればいい */
function drawSpots(){
  if(S.phase!=='port'||typeof SPOTS==='undefined') return;
  for(const sp of SPOTS){
    const on = sp===hoverSpot, open = sp.id===shopOpen;
    if(!on&&!open) continue;
    const b=spotBox(sp);
    const x=Math.round(b.x0), y=Math.round(b.y0);
    const w=Math.round(b.x1-b.x0), h=Math.round(b.y1-b.y0);
    ctx.fillStyle = open ? 'rgba(242,179,44,.16)' : 'rgba(242,179,44,.08)';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle = open ? '#f2b32c' : 'rgba(242,179,44,.75)';
    const c=7;                                   // 四隅だけ。全周だと箱に見えて絵が死ぬ
    for(const [ax,ay,dx,dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){
      ctx.fillRect(ax-(dx<0?c:0), ay-(dy<0?1:0), c, 1);
      ctx.fillRect(ax-(dx<0?1:0), ay-(dy<0?c:0), 1, c);
    }
  }
}

/* 港の範囲。ここへ入ると操船を離れて入港が始まる */
function drawPortRing(){
  if(S.phase==='port'||!portRing) return;
  const B=S.boat, r=PORT.r, dk=dockPos();
  const x=dk.x-r-2+OX, y=dk.y-r-2+OY;
  if(x>VW||y>VH||x+portRing.width<0||y+portRing.height<0) return;
  ctx.drawImage(portRing, x|0, y|0);
}
function drawPortArrow(){
  if(S.phase!=='sea') return;
  const B=S.boat, sx=PORT.x+OX, sy=PORT.y+OY;
  const m=26;
  if(sx>m && sx<VW-m && sy>m && sy<VH-m) return;     // 港が見えているなら出さない
  const a=Math.atan2(PORT.y-B.y, PORT.x-B.x);
  /* 上は時計と積荷、下は強化チップと魚探が居る。その帯を避けた楕円に乗せる */
  const top=42, bot=VH-58;
  const cx=VW/2, cy=(top+bot)/2, rx=VW/2-24, ry=(bot-top)/2;
  const ca=Math.cos(a), sa=Math.sin(a);
  const k=Math.min(rx/Math.max(1e-3,Math.abs(ca)), ry/Math.max(1e-3,Math.abs(sa)));
  const px0=cx+ca*k, py0=cy+sa*k;
  ctx.save();
  ctx.translate(px0|0, py0|0); ctx.rotate(a);
  ctx.fillStyle='#03121d';
  ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-6,-6); ctx.lineTo(-3,0); ctx.lineTo(-6,6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f2b32c';
  ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,-5); ctx.lineTo(-2,0); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
  ctx.restore();
  // 錨は回さない。向きが読めなくなる
  if(anchorCv) ctx.drawImage(anchorCv, Math.round(px0-ca*11)-4, Math.round(py0-sa*11)-5);
}
let fishDrawn=0;
/* 魚は16x16あるので、密な群れでは画面の何倍もの面積を重ね描きしてしまう。
   画面を粗い升目に切って、1升に DENS_CAP 匹より多くは描かない。
   重なって見えない個体を落とすだけなので、密度の見た目はほとんど変わらない。
   DENS_CELL を大きく／DENS_CAP を小さくするほど軽くなって、群れが薄く見えはじめる */
const DENS_CELL=6, DENS_CAP=2;
const DENS_W=Math.ceil((VW+18)/DENS_CELL)+1, DENS_H=Math.ceil((VH+18)/DENS_CELL)+1;
const densGrid=new Uint8Array(DENS_W*DENS_H);
function drawSchools(){
  const B=S.boat, ox=OX, oy=OY;
  fishDrawn=0;
  densGrid.fill(0);
  const k=1/TAU*ANG;
  for(const s of S.schools){
    const cx=s.cx+ox, cy=s.cy+oy, krx=s.rx*s.k, kry=s.ry*s.k;
    const mg=krx+40;
    if(cx<-krx-mg||cx>VW+krx+mg||cy<-kry-mg||cy>VH+kry+mg) continue;
    // 群れの影は描かない。cx/cy/krx は画面外カリングの判定にだけ使う
    const fs=s.fish;
    for(let i=0;i<fs.length;i++){
      const f=fs[i]; if(!f.alive) continue;
      const x=f.wx+ox, y=f.wy+oy;
      if(x<-9||x>VW+9||y<-9||y>VH+9) continue;
      const gi=((y+9)/DENS_CELL|0)*DENS_W+((x+9)/DENS_CELL|0);
      if(densGrid[gi]>=DENS_CAP) continue;          // ここはもう埋まっている
      densGrid[gi]++;
      const ai=((Math.round(f.a*k)%ANG)+ANG)%ANG;
      ctx.drawImage(fishAtlas, ai*CELL, f.dd*CELL, CELL, CELL, (x-CELL/2)|0, (y-CELL/2)|0, CELL, CELL);
      fishDrawn++;
    }
  }
}
function drawChests(){
  const B=S.boat, ox=OX, oy=OY;
  for(const c of S.chests){
    const x=Math.round(c.x+ox), y=Math.round(c.y+oy+Math.sin(c.ph)*1.5);
    if(x<-30||x>VW+30||y<-30||y>VH+30) continue;
    const g=ctx.createRadialGradient(x+9,y+8,2,x+9,y+8,26);
    g.addColorStop(0,'rgba(242,179,44,.35)'); g.addColorStop(1,'rgba(242,179,44,0)');
    ctx.fillStyle=g; ctx.fillRect(x-17,y-18,52,52);
    ctx.drawImage(chestCv,x,y);
  }
}
function drawWake(){
  const B=S.boat, ox=OX, oy=OY;
  for(const w of S.wake){
    const u=w.t/1.1;
    ctx.globalAlpha=(1-u)*.5;
    ctx.fillStyle='#dceef6';
    ctx.fillRect(Math.round(w.x+ox), Math.round(w.y+oy+u*2), Math.round(w.r+u*3), 1);
  }
  ctx.globalAlpha=1;
}
function drawGulls(){
  const B=S.boat, ox=OX, oy=OY;
  for(const s of S.schools){
    const gs=s.gulls; if(!gs) continue;
    const live=Math.ceil(gs.length*s.alive/s.n0);   // 魚が減ると鳥も減っていく
    const R=s.rx*s.k;
    for(let i=0;i<live;i++){
      const gu=gs[i], rr=R*gu.r;
      const x=s.cx+Math.cos(gu.a)*rr+ox;
      const y=s.cy+Math.sin(gu.a)*rr*0.6+oy-7-Math.sin(S.rt*1.7+gu.ph)*2;
      if(x<-8||x>VW+8||y<-8||y>VH+8) continue;
      ctx.globalAlpha=.22; ctx.fillStyle='#04202f';
      ctx.fillRect(Math.round(x), Math.round(y)+8, 1, 1);   // 水面の影で高さを出す
      ctx.globalAlpha=1;
      const dir=gu.a+(gu.w>0?Math.PI/2:-Math.PI/2);
      const ai=((Math.round(dir/TAU*GANG)%GANG)+GANG)%GANG;
      const fr=((S.rt*gu.fs+gu.ph)|0)&1;
      ctx.drawImage(gullAtlas, ai*GCELL, fr*GCELL, GCELL, GCELL,
        (x-GCELL/2)|0, (y-GCELL/2)|0, GCELL, GCELL);
    }
  }
}
function drawRings(){
  const B=S.boat, ox=OX, oy=OY;
  ctx.strokeStyle='#dff0f6'; ctx.lineWidth=1;
  for(const r of S.rings){
    const u=r.t/.36, rr=2+u*8;
    ctx.globalAlpha=(1-u)*.55;
    ctx.beginPath(); ctx.ellipse(r.x+ox, r.y+oy, rr, rr*.5, 0,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function fsprite(fm){ return (netGear()?netters:fishers)[fm.row][fm.pose][fm.pal]; }
function drawFisher(fm){
  const sp=fsprite(fm);
  ctx.drawImage(sp.cv, Math.round(fm.lx-sp.ax), Math.round(fm.ly-sp.ay));
}
function drawNpcs(){
  const ox=OX, oy=OY, fishing=S.phase==='sea';
  for(const nb of S.npcs){
    const b=nb.b, sx=Math.round(nb.x+ox), sy=Math.round(nb.y+oy+Math.sin(nb.bob)*1.2);
    if(sx<-b.W||sx>VW+b.W||sy<-b.H||sy>VH+b.H) continue;
    ctx.globalAlpha=.32; ctx.fillStyle='#04202f';
    ctx.beginPath(); ctx.ellipse(sx,sy+5,b.len/2+7,7,0,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
    ctx.save(); ctx.translate(sx,sy); if(nb.face<0) ctx.scale(-1,1);
    for(const fm of nb.crew) if(fm.row===1) drawFisher(fm);
    ctx.drawImage(b.cv,-Math.round(b.W/2),-b.waterY);
    for(const fm of nb.crew) if(fm.row===0) drawFisher(fm);
    ctx.restore();
    if(fishing && nb.state==='out' && nb.tgt && Math.hypot(nb.tgt.cx-nb.x,nb.tgt.cy-nb.y)<nb.tgt.rx*nb.tgt.k+40){   // 群れに乗っているあいだだけ糸を垂らす
      ctx.fillStyle='rgba(216,232,240,.45)';
      for(const fm of nb.crew){
        if(fm.pose===1) continue;
        const sp=fsprite(fm), tx=nb.face<0?-(fm.lx+sp.tip.x):(fm.lx+sp.tip.x);
        const x0=sx+Math.round(tx), y0=sy+Math.round(fm.ly+sp.tip.y), dir=fm.row===0?1:-1;
        for(let i=1;i<=8;i++) ctx.fillRect(x0, y0+dir*i, 1, 1);
      }
    }
  }
}
function drawBoat(){
  const b=boats[S.up.hull-1], B=S.boat;
  const sx=Math.round(boatSX()), sy=Math.round(boatSY())+bobPx;
  ctx.globalAlpha=.32; ctx.fillStyle='#04202f';
  ctx.beginPath(); ctx.ellipse(sx,sy+5,b.len/2+7,7,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(sx,sy); if(B.face<0) ctx.scale(-1,1);
  for(const fm of S.crew) if(fm.row===1) drawFisher(fm);
  ctx.drawImage(b.cv, -Math.round(b.W/2), -b.waterY);
  for(const fm of S.crew) if(fm.row===0) drawFisher(fm);
  if(S.fever){                                   // 船室の上で振る。背の高い船は船ごとの位置に立てる
    const fl=b.flag||{x:9,y:1};
    ctx.drawImage(flagCv[(S.rt*11|0)&3], -Math.round(b.W/2)+fl.x, -b.waterY+fl.y);
  }
  ctx.restore();
  const spd=Math.hypot(B.vx,B.vy);
  if(spd>6){                                   // 船首の白波
    const bx=sx+B.face*(b.len/2-2);
    ctx.fillStyle='rgba(233,246,250,.7)';
    for(let i=0;i<3;i++){
      const t=(S.t*7+i*.33)%1;
      ctx.fillRect(Math.round(bx-B.face*t*10), Math.round(sy+1+i), Math.round(2+t*4), 1);

}
function drawSpray(){

function drawBoil(){

function drawLines(){
  if(netGear()) return;                       // 網のときは竿を出さない
  const B=S.boat, ox=OX, oy=OY;
  const bx=Math.round(boatSX()), by=Math.round(boatSY());
  const by0=by+bobPx, HULL_BOT=4;
  for(const fm of S.crew){
    if(fm.pose===1) continue;
    const dir=fm.row===0?1:-1;
    const eff=navEff();                            // 飛ばすほど竿が上がる
    if(eff<=0.02) continue;
    const nrod=Math.min(fm.rod||0, ROD_MAX);       // 元の1本＋追加ぶん。最大3本（両手＋口）
    for(let k=0;k<=nrod;k++){
      const x0=Math.round(bx+fm.tipx)+(k?((k&1)?-((k+1)>>1):((k+1)>>1)):0);
      const y0=Math.round(by+fm.tipy)+bobPx-(k?((k+1)>>1):0);
      const len=Math.max(2,Math.round((fm.lineLen-k)*eff)), sl=fm.lineSlant+k*1.3*(k&1?-1:1);
      let lx=x0, ly=y0;
      for(let i=1;i<=len;i++){
        ly=y0+dir*i; lx=x0+Math.round(sl*i/len);
        ctx.fillStyle=(ly-by0>HULL_BOT||dir<0)?'rgba(216,232,240,.5)':'rgba(216,232,240,.2)';
        ctx.fillRect(lx,ly,1,1);
      }
      ctx.fillStyle='rgba(240,250,255,.8)';
      ctx.fillRect(lx,ly,1,1);
    }
  }
  ctx.strokeStyle='rgba(236,247,252,.8)'; ctx.lineWidth=1;
  for(const p of S.parts){
    const tx=Math.round(bx+p.fm.tipx)+.5, ty=Math.round(by+p.fm.tipy)+bobPx+.5;
    const px2=Math.round(p.x+ox)+.5, py2=Math.round(p.y+oy)+.5;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(px2,py2); ctx.stroke();
    const ai=((Math.round(p.a/TAU*ANG)%ANG)+ANG)%ANG;
    ctx.drawImage(fishAtlas, ai*CELL, 3*CELL, CELL, CELL, (px2-CELL/2)|0, (py2-CELL/2)|0, CELL, CELL);
  }

    const u=fl.t/.16, r=1+u*3.5;
    const x=Math.round(bx+fl.fm.tipx), y=Math.round(by+fl.fm.tipy)+bobPx;
    ctx.globalAlpha=(1-u)*.9;
    ctx.fillStyle='#fff6dd';
    ctx.fillRect(x-r,y,r*2,1); ctx.fillRect(x,y-r,1,r*2);
  }
  ctx.globalAlpha=1;
}
function drawStick(){
  const st=S.stick;
  st.f+=((st.on?1:0)-st.f)*0.22;
  if(st.f<0.03) return;
  const ax=Math.round(st.ax), ay=Math.round(st.ay);
  ctx.globalAlpha=st.f*0.22;                  // 海に埋もれないよう下地を敷く
  ctx.fillStyle='#041a28';
  ctx.beginPath(); ctx.arc(ax,ay,STICK_R+2,0,TAU); ctx.fill();
  ctx.globalAlpha=st.f*0.6; ctx.fillStyle='#cfe3ec';
  for(let i=0;i<16;i++){                      // 支点の輪
    const a=i/16*TAU;
    ctx.fillRect(ax+Math.round(Math.cos(a)*STICK_R)-1, ay+Math.round(Math.sin(a)*STICK_R)-1, 2,2);
  }
  const dx=st.tx-st.ax, dy=st.ty-st.ay, m=Math.hypot(dx,dy);
  if(m>STICK_DEAD){                           // 支点から舵の向きへ点線
    ctx.globalAlpha=st.f*0.5;
    for(let i=STICK_DEAD;i<m;i+=3) ctx.fillRect(ax+Math.round(dx/m*i), ay+Math.round(dy/m*i),1,1);
  }
  ctx.globalAlpha=st.f;
  const tx=Math.round(st.tx), ty=Math.round(st.ty);
  ctx.fillStyle='#7a4f08'; ctx.fillRect(tx-3,ty-3,7,7);
  ctx.fillStyle='#f2b32c'; ctx.fillRect(tx-2,ty-2,5,5);
  ctx.fillStyle='#ffe6a8'; ctx.fillRect(tx-1,ty-1,2,2);
  ctx.globalAlpha=1;
}
function drawTrawl(){
  if(S.gear!=='trawl') return;
  const B=S.boat, T=S.trawl, ox=OX, oy=OY;
  const ca=Math.cos(T.hd), sa=Math.sin(T.hd);
  const hd2=TR.depth*0.5;
  const P=(lx,ly)=>[T.x+lx*ca-ly*sa+ox, T.y+lx*sa+ly*ca+oy+bobPx];
  const boosting=navBoost();
  const N=14;
  ctx.lineWidth=1;

  // 曳き綱：船から口の両端へ
  const m0=P(hd2,-trawlHalfW(0)), m1=P(hd2,trawlHalfW(0));
  ctx.globalAlpha=0.30*(1-0.4*REDUCE); ctx.strokeStyle='#c9b184';
  ctx.beginPath();
  ctx.moveTo(Math.round(B.x+ox)+.5, Math.round(B.y+oy+bobPx)+.5);
  ctx.lineTo(Math.round(m0[0])+.5, Math.round(m0[1])+.5);
  ctx.moveTo(Math.round(B.x+ox)+.5, Math.round(B.y+oy+bobPx)+.5);
  ctx.lineTo(Math.round(m1[0])+.5, Math.round(m1[1])+.5);
  ctx.stroke();

  // 網の輪郭。判定と同じ w(u) を辿るので見た目と当たりが一致する
  ctx.globalAlpha=(boosting?0.7:0.5)*(1-0.4*REDUCE);
  ctx.strokeStyle=boosting?'#ffe9b0':'#6fd0c0';
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const u=i/N, q=P(hd2-u*TR.depth, trawlHalfW(u));
    if(i===0) ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]);
  }
  for(let i=N;i>=0;i--){
    const u=i/N, q=P(hd2-u*TR.depth, -trawlHalfW(u));
    ctx.lineTo(q[0],q[1]);
  }
  ctx.closePath(); ctx.stroke();
  // 口の丸み（浮子綱）
  const lip=trawlHalfW(0)*TR.lip;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const v=-1+2*i/N, q=P(hd2+lip*(1-v*v), v*trawlHalfW(0));
    if(i===0) ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]);
  }
  ctx.stroke();

  // 目
  ctx.globalAlpha=0.22*(1-0.4*REDUCE);
  ctx.fillStyle=boosting?'#ffe9b0':'#6fd0c0';
  for(let i=1;i<9;i++){
    const u=i/9, w=trawlHalfW(u);
    for(let j=0;j<7;j++){
      if(((i+j)&1)) continue;
      const q=P(hd2-u*TR.depth, (-1+2*j/6)*w);
      ctx.fillRect(Math.round(q[0]),Math.round(q[1]),1,1);
    }
  }

  ctx.globalAlpha=1;
}
function drawNet(){
  if(S.gear!=='seine') return;
  const B=S.boat, N=S.net, ox=OX, oy=OY;
  const cx=boatSX(), cy=boatSY()+bobPx, R=netR(), Ry=R*NET.flat;
  if(!navBoost()){
    const pulling=N.phase==='pull';
    const u=pulling ? 1-N.t/NET.pull : 1-Math.min(1,N.t/Math.max(.001,netCycle()));
    const k=pulling ? Math.max(0.10,1-u*u) : 1;    // 締めると縮む
    const rr=R*k, ry2=Ry*k;
    // 船から網へ渡す綱
    const bl=boats[S.up.hull-1].len*0.34;
    ctx.globalAlpha=(pulling?0.6:0.22)*(1-0.4*REDUCE);
    ctx.strokeStyle='#c9b184'; ctx.lineWidth=1;
    for(let i=0;i<8;i++){
      const a=i/8*TAU+Math.PI/8, ca=Math.cos(a), sa=Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(Math.round(cx+ca*bl)+.5, Math.round(cy+sa*7)+.5);
      ctx.lineTo(Math.round(cx+ca*rr)+.5, Math.round(cy+sa*ry2)+.5);
      ctx.stroke();
    }
    // 網の輪。締めているあいだは金色に張る
    ctx.globalAlpha=(pulling?0.95:0.22+0.45*u)*(1-0.4*REDUCE);
    ctx.strokeStyle=pulling?'#ffe9b0':'#6fd0c0';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(cx,cy,rr,ry2,0,0,TAU); ctx.stroke();
    // 目。輪に沿って点を打つ
    ctx.fillStyle=pulling?'#ffe9b0':'#6fd0c0';
    ctx.globalAlpha=(pulling?0.55:0.20)*(1-0.4*REDUCE);
    for(let i=0;i<40;i++){
      const a=i/40*TAU, ca=Math.cos(a), sa=Math.sin(a);
      const q=0.82+0.06*((i&1)?1:-1);
      ctx.fillRect(Math.round(cx+ca*rr*q), Math.round(cy+sa*ry2*q), 1, 1);
    }
    if(!pulling){                                   // 残り時間を輪の上の点で見せる
      const a=-Math.PI/2+u*TAU;
      ctx.globalAlpha=0.9; ctx.fillStyle='#6fd0c0';
      ctx.fillRect(Math.round(cx+Math.cos(a)*R)-1, Math.round(cy+Math.sin(a)*Ry)-1, 3, 3);
    }
    ctx.globalAlpha=1;
  }
  if(N.phase==='pull'){                             // 締められて船へ寄る魚
    const u=1-N.t/NET.pull, e=u*u;
    for(const h of N.held){
      const x=h.x0+(B.x-h.x0)*e, y=h.y0+(B.y-h.y0)*e;
      const ai=((Math.round(h.a/TAU*ANG)%ANG)+ANG)%ANG;
      ctx.drawImage(fishAtlas, ai*CELL, 3*CELL, CELL, CELL,
        (Math.round(x+ox)-CELL/2)|0, (Math.round(y+oy)-CELL/2)|0, CELL, CELL);
    }
  }
}

/* ================= 魚群探知機 ================= */
/* 魚探の色エコー。反応が強いほど赤へ寄る、実機の配色に倣った段階色 */
const ECHO=['#17527e','#1b7f8c','#1f9a63','#63b23a','#d4c132','#e0892a','#dc4b24','#e0332c'];
const RCELL=7;                 // エコー1マスの画素数
const ECHO_DENS=250;           // 近傍平均の密度から色段階への換算係数。上げるほど赤くなりやすい
const ECHO_RANGE=68;           // 近傍として見る海の半径(px)。レンジが変わっても一定に保つ
let echoGrid=null, echoTmp=null, echoBlur=null, echoCols=0;
function drawEchoes(g,C,R,k,B,sw){
  const W=rcv.width;
  if(!echoGrid){
    echoCols=Math.ceil(W/RCELL);
    echoGrid=new Float32Array(echoCols*echoCols);
    echoTmp=new Float32Array(echoCols*echoCols);
    echoBlur=new Float32Array(echoCols*echoCols);
  }
  echoGrid.fill(0);
  for(const s of S.schools){                  // 魚を間引いて拾い、間引いた分を重みにする
    const fs=s.fish, step=Math.max(1,Math.round(s.alive/400));
    for(let i=0;i<fs.length;i+=step){
      const f=fs[i]; if(!f.alive) continue;
      const x=C+(f.wx-B.x)*k, y=C+(f.wy-B.y)*k;
      if(x<0||y<0||x>=W||y>=W) continue;
      echoGrid[((y/RCELL)|0)*echoCols+((x/RCELL)|0)]+=step;
    }
  }
  const N=echoCols;
  const kr=Math.max(1,Math.min(7,Math.round(ECHO_RANGE*k/RCELL)));   // 近傍の半径(マス)
  const EKS=kr+1;
  for(let y=0;y<N;y++){                       // 横方向
    const row=y*N;
    for(let x=0;x<N;x++){
      let a=0;
      for(let t=-kr;t<=kr;t++){ const xx=x+t; if(xx<0||xx>=N) continue; a+=echoGrid[row+xx]*(EKS-Math.abs(t)); }
      echoTmp[row+x]=a/(EKS*EKS);
    }
  }
  for(let y=0;y<N;y++){                       // 縦方向。空きセルが混じるほど平均が下がる
    for(let x=0;x<N;x++){
      let a=0;
      for(let t=-kr;t<=kr;t++){ const yy=y+t; if(yy<0||yy>=N) continue; a+=echoTmp[yy*N+x]*(EKS-Math.abs(t)); }
      echoBlur[y*N+x]=a/(EKS*EKS);
    }
  }
  const cw=RCELL/k, norm=ECHO_DENS/(cw*cw), R2=R*R, half=RCELL/2;
  for(let cy=0;cy<N;cy++){
    const py=cy*RCELL, dy=py+half-C;
    for(let cx=0;cx<N;cx++){
      if(echoGrid[cy*N+cx]<=0) continue;      // 魚がいるマスだけ点灯。色は周囲から決める
      const px2=cx*RCELL, dx=px2+half-C;
      if(dx*dx+dy*dy>R2) continue;
      const lv=Math.min(ECHO.length-1, Math.max(0, Math.round(echoBlur[cy*N+cx]*norm)-1));
      let da=sw-Math.atan2(dy,dx); da=((da%TAU)+TAU)%TAU;
      g.globalAlpha=.45+.55*(1-da/TAU);       // 掃引の残光
      g.fillStyle=ECHO[lv];
      g.fillRect(px2,py,RCELL-1,RCELL-1);
    }
  }
  g.globalAlpha=1;
}
const rcv=document.getElementById('radar'), rctx=rcv.getContext('2d');
function drawRadar(){
  const g=rctx, W=rcv.width, C=W/2, R=W/2-4, B=S.boat, range=stat.sonar(), k=R/range;
  g.clearRect(0,0,W,W);
  g.save();
  g.beginPath(); g.arc(C,C,R,0,TAU); g.clip();
  g.fillStyle='#04212e'; g.fillRect(0,0,W,W);
  g.strokeStyle='rgba(63,191,160,.20)'; g.lineWidth=1;
  for(let i=1;i<=3;i++){ g.beginPath(); g.arc(C,C,R*i/3,0,TAU); g.stroke(); }
  g.beginPath(); g.moveTo(C-R,C); g.lineTo(C+R,C); g.moveTo(C,C-R); g.lineTo(C,C+R); g.stroke();
  const sw=S.t*1.15%TAU;
  g.save();                                   // 掃引
  g.translate(C,C); g.rotate(sw);
  g.fillStyle='rgba(63,191,160,.10)';
  g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,-0.55,0); g.closePath(); g.fill();
  g.strokeStyle='rgba(63,191,160,.55)';
  g.beginPath(); g.moveTo(0,0); g.lineTo(R,0); g.stroke();
  g.restore();
  g.strokeStyle='rgba(234,243,244,.22)';      // 画面範囲
  g.strokeRect(C-VW/2*k, C-VH/2*k, VW*k, VH*k);
  drawEchoes(g,C,R,k,B,sw);                   // 魚群の反応（実位置をセルに集計）
  for(const s of S.schools){                  // 鳥山。時間切れが近いほど速く点滅する
    const T=s.tori; if(!T || s.alive<=0 || T.age>=TORI.life) continue;
    /* 範囲の外にいるあいだは縁に貼りつけて、外向きの矢印で方角だけ示す */
    const dx=s.cx-B.x, dy=s.cy-B.y, dist=Math.hypot(dx,dy)||1, ux=dx/dist, uy=dy/dist;
    const rim=R-W*0.07, inside=dist*k<=rim;
    const x=C+ux*(inside?dist*k:rim), y=C+uy*(inside?dist*k:rim);
    const left=TORI.life-T.age, hz=left<TORI.warn?6:1.6;
    const on=(Math.sin(S.rt*TAU*hz)>-0.2);
    if(inside){
      const pr=((S.rt*0.9)%1);                    // 外へ広がる輪
      g.strokeStyle='rgba(255,246,221,'+(0.7*(1-pr)).toFixed(2)+')'; g.lineWidth=2;
      g.beginPath(); g.arc(x,y,8+pr*W*0.09,0,TAU); g.stroke();
    }else{
      const a=Math.atan2(uy,ux), L=W*0.05;         // 外向きの矢印
      g.fillStyle='#fff6dd';
      g.beginPath();
      g.moveTo(x+Math.cos(a)*L*1.7, y+Math.sin(a)*L*1.7);
      g.lineTo(x+Math.cos(a+2.4)*L, y+Math.sin(a+2.4)*L);
      g.lineTo(x+Math.cos(a-2.4)*L, y+Math.sin(a-2.4)*L);
      g.closePath(); g.fill();
    }
    if(on){
      const sc=Math.max(2,Math.round(W/70));
      g.imageSmoothingEnabled=false;
      g.drawImage(gullAtlas, 2*GCELL, 0, GCELL, GCELL, Math.round(x-GCELL*sc/2), Math.round(y-GCELL*sc/2), GCELL*sc, GCELL*sc);
    }
  }
  g.fillStyle='rgba(234,243,244,.8)';          // NPC船
  for(const nb of S.npcs){
    const x=C+(nb.x-B.x)*k, y=C+(nb.y-B.y)*k;
    if(x>-4&&x<W+4&&y>-4&&y<W+4) g.fillRect(Math.round(x)-2, Math.round(y)-1, 5, 3);
  }
  {                                           // 港は錨ひとつで示す。陸を塗ると魚の反応が読みにくい
    const d=dockPos(), x=C+(d.x-B.x)*k, y=C+(d.y-B.y)*k;
    if(x>-8 && x<W+8 && y>-8 && y<W+8 && anchorCv){
      const sc=Math.max(1,Math.round(W/60));
      g.imageSmoothingEnabled=false;
      g.drawImage(anchorCv, Math.round(x-4.5*sc), Math.round(y-5.5*sc), 9*sc, 11*sc);
    }
  }
  for(const c of S.chests){                   // 宝箱
    const x=C+(c.x-B.x)*k, y=C+(c.y-B.y)*k;
    g.fillStyle='#f2b32c';
    g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillRect(-6,-6,12,12); g.restore();
    g.fillStyle='#3a2a10'; g.font='bold '+Math.round(W/26)+'px monospace'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('?',x,y+1);
  }
  g.restore();
  const b=boats[S.up.hull-1];                 // 自船
  g.fillStyle='#eaf3f4'; g.fillRect(C-b.len*k/2, C-2, Math.max(6,b.len*k), 4);
  g.fillStyle='#e0332c'; g.fillRect(C+(S.boat.face>0?b.len*k/2-2:-b.len*k/2), C-3, 3, 6);
  g.strokeStyle='rgba(242,179,44,.5)'; g.lineWidth=2;
  g.beginPath(); g.arc(C,C,R,0,TAU); g.stroke();
}

const STICK_R=26, STICK_DEAD=5;
function onField(e){ return e.target===cv || e.target===frameEl; }
function toLocal(e){
  const r=frameEl.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH};
}
function aimMouse(e){                      // PC：画面中央から見た向き。遠いほど速い
  if(!onField(e)) return;
  beginRun();
  const r=frameEl.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy);
  if(m<=r.width*NAV_DEAD){ S.dir.x=0; S.dir.y=0; S.dir.t=0; return; }
  // その向きで画面の縁までどれだけあるか。縁に着けた時にちょうど目一杯になる
  const edge=Math.min(r.width/2*m/Math.max(1e-6,Math.abs(dx)),
                      r.height/2*m/Math.max(1e-6,Math.abs(dy)));
  S.dir.t=navThrottle(Math.min(1, m/edge));
  S.dir.x=dx/m; S.dir.y=dy/m;
}
frameEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){ aimMouse(e); return; }
  if(!onField(e) || S.stick.id!==-1) return;   // 重なった2本目の指は無視
  e.preventDefault();
  const p=toLocal(e), st=S.stick;
  st.id=e.pointerId; st.on=true;
  st.ax=p.x; st.ay=p.y; st.tx=p.x; st.ty=p.y;
  beginRun();
});
frameEl.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){ aimMouse(e); return; }
  const st=S.stick;
  if(e.pointerId!==st.id) return;
  e.preventDefault();
  const p=toLocal(e);
  let dx=p.x-st.ax, dy=p.y-st.ay, m=Math.hypot(dx,dy);
  if(m>STICK_R){                              // 引っ張りすぎたら支点を連れていく
    const k=1-STICK_R/m;
    st.ax+=dx*k; st.ay+=dy*k;
    dx*=STICK_R/m; dy*=STICK_R/m; m=STICK_R;
  }
  st.tx=st.ax+dx; st.ty=st.ay+dy;
  if(m>STICK_DEAD){ S.dir.x=dx/m; S.dir.y=dy/m; }   // 内側では舵を変えない
  S.dir.t = m<=STICK_DEAD ? 0 : navThrottle(Math.min(1, m/STICK_R));   // 目一杯倒すと加速
});
function endStick(e){
  if(e.pointerId===S.stick.id){ S.stick.id=-1; S.stick.on=false; }  // 離しても進路は維持
}
frameEl.addEventListener('pointerdown',()=>audioInit());
frameEl.addEventListener('pointerup',endStick);

let AC=null,MG=null,muted=false,lastCatchS=0,noiseBuf=null,lastSec=GAME_TIME;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain(); MG.gain.value=.32; MG.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  }catch(err){ AC=null; }
}
function tone(f,dur,type,gain,slide,delay){
  if(!AC||muted) return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+.03);
}
function splash(gain){
  if(!AC||muted||!noiseBuf) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=rnd(1600,3200); bp.Q.value=1.1;
  const g=AC.createGain(); g.gain.value=gain;
  s.connect(bp); bp.connect(g); g.connect(MG); s.start();
}
function sfxCatch(){
  if(!AC||muted) return;
  const now=AC.currentTime;
  if(now-lastCatchS<.026) return;
  lastCatchS=now;
  const up=1+0.95*Math.min(1,S.chain/40);        // 連が伸びるほど高く
  tone(rnd(640,1020)*up,.07,'triangle',.055,1.7);
  if(Math.random()<.5) splash(.03);
}

  [523,784,1046,1568].forEach((f,i)=>tone(f,.26,'square',.08,1.3,i*.055));

}
function sfxFever(){

}
function sfxLevel(){ [523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.09,1,i*.07)); }
function sfxPick(){ tone(880,.12,'square',.05,1.2); }
function sfxNet(){ tone(180,.20,'sawtooth',.09,.7); tone(430,.14,'square',.05,1.25,.04); }

function spotAt(mx,my){
