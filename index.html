/* 船の正体は、次に建てられる船として解放されるまで「？？？」にしておく。
   解放の知らせで初めて名前が出る。一度見た船は覚えておき、「最初から」でも忘れない
   （秘密にするのは初回だけ）。セーブとは別の場所にしまう */
const SEEN_KEY='island.seen';
const seenShips=new Set([0]);
try{ for(const i of JSON.parse(localStorage.getItem(SEEN_KEY)||'[]')) seenShips.add(i|0); }catch(e){}
function markSeen(i){
  if(seenShips.has(i)) return;
  seenShips.add(i);
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...seenShips])); }catch(e){}
}
/* 持っている船と、次に建てられる（解放済みの）船だけを明かす。その先は条件を満たしていても伏せる */
function revealShips(){
  for(let i=0;i<=S.fac.ship;i++) markSeen(i);
  const L=S.fac.ship+1;
  if(L<=FAC.ship.max && unlocked('ship',L)) markSeen(L);
}
function shipLabel(i){ return seenShips.has(i) ? SHIP_NAME[i] : '？？？'; }
/* 次に目指す船。造船所の上のほうは島全体を育てないと開かないので、何が足りないかを常に出す */
function nextShipLine(){
  const L=S.fac.ship+1; if(L>FAC.ship.max) return '';
  return unlocked('ship',L)
    ? '\n次の船 <b>'+shipLabel(L)+'</b>  <em>'+yen(SHIPS[L].price)+'で建造できる</em>'
    : '\n次の船 <b>'+shipLabel(L)+'</b> 🔒\n'+condHtml(reqOf('ship',L));
}
function shopRow(icon,name,sub,price,ok,onClick){
  const b=document.createElement('button'); b.className='prow'; b.disabled=!ok;
  if(icon){ const c=document.createElement('canvas'); c.width=16;c.height=16;
    c.getContext('2d').drawImage(icon,0,0); b.appendChild(c); }
  const n=document.createElement('div'); n.className='nm';
  n.innerHTML=name+(sub?'<em>'+sub+'</em>':''); b.appendChild(n);
  const pr=document.createElement('div'); pr.className='pr'; pr.textContent=price; b.appendChild(pr);
  /* 押すと paintPort が行ごと作り直すので、海のクリック判定へ抜ける前にここで止める。
     抜けると「何もない所を押した」と見なされて品書きが閉じてしまう */
  b.addEventListener('click',e=>{ e.stopPropagation(); });
  if(ok) b.addEventListener('click',onClick);
  elPShop.appendChild(b);
}
/* その Lv のときの能力を、読める言葉で */
function facEffect(id,lv){
  switch(id){
    case 'ship':   return shipLabel(lv)+'（乗員 '+(seenShips.has(lv)?SHIPS[lv].seats:'？？')+'人）';
    case 'engine': return (stat.speed({engine:lv*FAC_EFF.engine})*0.25).toFixed(1)+'ノット';
    case 'gear':   return '竿 1人 '+String(+(1+FAC_EFF.gear*lv).toFixed(1))+'本';
    case 'fish':   return yen(fishYen(lv))+'/本';
    case 'tank':   return '航続 '+fmtDist(fuelMaxAt(S.shipIdx,lv)*M_PER_PX);
  }
  return '';
}
function buyFac(id){
  const before=openSet();
  S.money-=facPrice(id); S.fac[id]++;
  applyFac(); buildPort();
  const d=dockPos(); S.boat.x=d.x; S.boat.y=d.y;      // 船が替わっても船着場に着けておく
  S.fuel=fuelMax();
  saveGame(); (id==='ship'?sfxChest:sfxPick)();
  /* 建てた結果、新しく解放されたものを知らせる。数えるのは条件の書かれた段（Lv4・7・9、船など）が
     開いたときだけ。その次のLvは同じ条件を引き継いでいるだけなので知らせない */
  const fresh=[...openSet()].filter(k=>{ const [fid,L]=k.split(':'); return !before.has(k) && !!(REQ[fid]&&REQ[fid][+L]); });
  revealShips();
  if(fresh.length) showUnlock(fresh.map(k=>{ const [fid,L]=k.split(':');
    return fid==='ship' ? '<b class="newship">'+SHIP_NAME[+L]+'</b>' : FAC[fid].name+(+L===1?'':' Lv'+L); }));
  paintPort();
}
function paintFac(id){
  const f=FAC[id], lv=S.fac[id];
  if(id==='ship'){                                  // 造船所は残りの船を全部並べる。次の目標が見えるように
    if(lv>=f.max){ shopRow(ICONS.ship, SHIP_NAME[lv], '乗員 '+SHIPS[lv].seats+'人　これ以上大きな船は無い', '—', false, ()=>{}); return; }
    for(let L=lv+1; L<=f.max; L++){
      const open=unlocked(id,L), next=L===lv+1, price=SHIPS[L].price;
      const known=seenShips.has(L), seats=known?SHIPS[L].seats:'？？';
      let sub = next ? '乗員 '+SHIPS[L-1].seats+' → '+seats+'人' : '乗員 '+seats+'人';
      if(!open) sub+='<br>'+condHtml(reqOf(id,L));
      else if(!next) sub+='　'+shipLabel(L-1)+'のあと';
      shopRow(ICONS.ship, shipLabel(L)+(open?'':' 🔒'), sub, yen(price), next&&open&&S.money>=price, ()=>buyFac(id));
    }
    return;
  }
  if(lv>=f.max){ shopRow(ICONS[id]||null, f.name+'　Lv'+lv, facEffect(id,lv)+'　これ以上は上げられない', '—', false, ()=>{}); return; }
  const L=lv+1, open=unlocked(id,L), price=facPrice(id);
  let sub=facEffect(id,lv)+' → '+facEffect(id,L)+'<br>人口 '+population()+' → '+(population()+POP.perLv)+'人';
  if(!open) sub+='<br>'+condHtml(reqOf(id,L));
  else{                                             // 解放済みなら、この先の関所を1つだけ見せる
    let k=-1; for(const key in (REQ[id]||{})) if(+key>L && (k<0||+key<k)) k=+key;
    if(k>0 && k<=f.max && !unlocked(id,k)) sub+='<br><span class="rq ahead">Lv'+k+'から：'+reqOf(id,k).map(condText).join(' / ')+'</span>';
  }
  shopRow(ICONS[id]||null, f.name+'　Lv'+lv+' → '+L+(open?'':' 🔒'), sub, yen(price), open&&S.money>=price, ()=>buyFac(id));
}
/* 解放の知らせ。港の画面の上に少しだけ出す */
const elPUnlock=document.getElementById('punlock');
function showUnlock(names){
  elPUnlock.innerHTML='<b>🔓 解放</b>'+names.map(n=>'<span>'+n+'</span>').join('');
  elPUnlock.classList.remove('on'); void elPUnlock.offsetWidth; elPUnlock.classList.add('on');
  clearTimeout(showUnlock._t); showUnlock._t=setTimeout(()=>elPUnlock.classList.remove('on'),3200);
  tone(988,.08,'triangle',.06,1.2); tone(1319,.12,'triangle',.06,1.2,.08);
}
/* 港では海面がそのまま操作盤になる。建物に合わせると名前が出て、押すと品書きが開く */
frameEl.addEventListener('mousemove',e=>{
  if(S.phase!=='port' || S.menu){ if(hoverSpot){ hoverSpot=null; showTip(null); frameEl.style.cursor=''; } return; }
  const p=toLocal(e), sp=spotAt(p.x,p.y);
  if(sp!==hoverSpot){ hoverSpot=sp; showTip(sp); frameEl.style.cursor=sp?'pointer':''; }
});
frameEl.addEventListener('mouseleave',()=>{ hoverSpot=null; showTip(null); frameEl.style.cursor=''; });
frameEl.addEventListener('click',e=>{
  if(S.phase==='landing'){ finishLanding(); return; }   // 見飽きたら飛ばせる
  if(S.phase!=='port') return;
  if(S.menu) return;
  if(e.target.closest && e.target.closest('.pshop,.pgo,.pinfo,.mute,.scrim')) return;
  const p=toLocal(e), sp=spotAt(p.x,p.y);
  if(!sp){ if(shopOpen){ shopOpen=null; paintPort(); } return; }
  shopOpen = shopOpen===sp.id ? null : sp.id;
  sfxPick(); paintPort();
});
document.getElementById('pgo').addEventListener('click',departPort);

/* ================= セーブ ================= */
const SAVE_KEY='island.save';
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({v:3, money:S.money, voyage:S.voyage, fac:S.fac})); }catch(e){}
}
function loadGame(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!d) return false;
  S.money=d.money|0; S.voyage=d.voyage|0;
  const f = Object.assign({}, d.fac || {         // 旧版（ひとつずつ買う方式）のセーブを施設Lvへ移す
    ship:d.ship|0, engine:Math.round((d.engine|0)/2), gear:Math.round((d.rate|0)/2),
    fish:0, tank:Math.round((d.tank|0)*5/8) });
  if(!(d.v>=3)) for(const id of FAC_IDS) if(id!=='ship') f[id]=(f[id]|0)*2;   // Lv5までだった頃のセーブは2倍
  for(const id of FAC_IDS) S.fac[id]=clamp(f[id]|0, 0, FAC[id].max);
  return true;
}

/* ================= メニュー ================= */
const scrMenu=document.getElementById('menu'), muteBtn=document.getElementById('mute');
const mSoundV=document.getElementById('mSoundV');
function paintSound(){
  mSoundV.textContent=t(muted?'menu.off':'menu.on');
  document.getElementById('mSound').classList.toggle('off', muted);
}
function openMenu(v){
  if(S.phase!=='sea' && S.phase!=='port') return;
  S.menu=v;
  scrMenu.classList.toggle('on', v);
  disarmReset();
  document.getElementById('mHome').hidden = S.phase!=='sea';
  if(v){ paintSound(); paintGear(); document.getElementById('mSound').focus({preventScroll:true}); }
}
/* 最初から。進行が全部消えるので、1回目は押しかけの状態にして、3秒以内にもう一度押したときだけ消す */
const mReset=document.getElementById('mReset');
let resetArmed=0;
function disarmReset(){ resetArmed=0; clearTimeout(disarmReset._t); mReset.classList.remove('armed'); mReset.textContent=t('menu.reset'); }
mReset.addEventListener('click',e=>{
  e.stopPropagation();
  if(!resetArmed){
    resetArmed=1; mReset.classList.add('armed'); mReset.textContent=t('menu.resetSure');
    clearTimeout(disarmReset._t); disarmReset._t=setTimeout(disarmReset,3000);
    return;
  }
  resetAll();
});
function resetAll(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S.money=0; S.voyage=0; S.landed=null;
  for(const id of FAC_IDS) S.fac[id]=0;
  S.fever=false; S.fvT=0; S.fvRound=0; S.fvLock=0; S.burst=null; S.shake=0;
  S.phase='port';
  applyFac(); buildPort();
  reset();                                     // 海と船の状態を仕切り直し、船を船着場へ
  S.mode='play'; S.started=true; S.camK=1;
  elHaul.classList.remove('on'); elHaul.textContent='';
  openMenu(false);
  showPort();
  saveGame();
}
muteBtn.addEventListener('click',e=>{ e.stopPropagation(); audioInit(); openMenu(!S.menu); });
const elHaul=document.getElementById('haul');
function paintGear(){}
document.getElementById('mSound').addEventListener('click',()=>{ muted=!muted; paintSound(); });
document.getElementById('mHome').addEventListener('click',()=>{ openMenu(false); beginReturn(); });
document.getElementById('mClose').addEventListener('click',()=>openMenu(false));
window.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  e.preventDefault();
  if(S.phase==='sea'||S.phase==='port') openMenu(!S.menu);
});

/* ================= 負荷計測（Fキーで開閉） ================= */
const elPerf=document.getElementById('perf');
const dbgFever=document.getElementById('dbgFever');
dbgFever.addEventListener('click',e=>{             // 左：発動／継続を1段  右：終了
  e.preventDefault(); e.stopPropagation();
  if(!S.fever) feverOn();
  else feverHit();
});
dbgFever.addEventListener('contextmenu',e=>{
  e.preventDefault(); e.stopPropagation();
  S.fever=false; S.fvT=0; S.fvLock=0; elFvBadge.style.transform='';
});
const perf={on:false, acc:0, n:0, upd:0, drw:0, worst:0};
function perfToggle(v){
  perf.on = v===undefined ? !perf.on : v;
  elPerf.hidden=!perf.on;
  dbgFever.hidden=!perf.on;
  elStats.classList.toggle('dbg', perf.on);
  perf.acc=perf.n=perf.upd=perf.drw=perf.worst=0;
  try{ localStorage.setItem('ippon.perf', perf.on?'1':'0'); }catch(e){}
}
function perfTick(raw,u,d){
  perf.acc+=raw; perf.n++; perf.upd+=u; perf.drw+=d;
  const ft=u+d; if(ft>perf.worst) perf.worst=ft;
  if(perf.acc<0.25) return;
  const fps=perf.n/perf.acc, ms=perf.acc/perf.n*1000;
  const up=perf.upd/perf.n, dr=perf.drw/perf.n;
  const hot=v=>v>=8?' class="hot"':'';
  elPerf.innerHTML=
    '<b'+(fps<50?' class="hot"':'')+'>'+fps.toFixed(1)+'</b> fps <u>'+ms.toFixed(1)+'ms</u>\n'+
    '更新 <i>'+up.toFixed(2)+'</i>  描画 <i'+hot(dr)+'>'+dr.toFixed(2)+'</i>  最悪 <i'+hot(perf.worst)+'>'+perf.worst.toFixed(1)+'</i> ms\n'+
    '魚 <b>'+fmt(S.totalFish)+'</b> 画面 <b>'+fmt(fishDrawn)+'</b>  群 <b>'+S.schools.length+'</b>\n'+
    '漁師 <b>'+S.crew.length+'</b>  竿 <b>'+S.parts.length+'</b>  飛沫 <b>'+(S.spray.length+S.wake.length+S.rings.length)+'</b>\n'+
    '<u>チップ 左+1 右-1 Shiftで5段</u>';
  perf.acc=perf.n=perf.upd=perf.drw=perf.worst=0;
}
window.addEventListener('keydown',e=>{
  if((e.key==='f'||e.key==='F') && !e.metaKey && !e.ctrlKey && !e.altKey) perfToggle();
});

/* ================= ループ ================= */
let last=performance.now();
function tick(now){
  const raw=(now-last)/1000; last=now;
  const dt=raw>.05?.05:raw;
  const p0=performance.now();
  S.rt+=dt;
  S.pop=Math.max(0,S.pop-dt*4.2);
  S.fvPulse=Math.max(0,S.fvPulse-dt*5);
  S.shake=Math.max(0,S.shake-dt*3.4);
  if(S.burst) S.burst.t+=dt;
  if(S.freeze>0) S.freeze-=dt;                   // 止まっている間も閃光だけは進む
  else if(!S.menu){
    if(S.started) S.t+=dt;
    if(S.phase==='sea') updateBoat(dt);
    manageWorld(dt); updateSchools(dt);
    updateVoyage(dt);
    updateCam(dt);
    updateTori(dt);
    updateNpcs(dt);
    if(S.phase==='returning') updateReturn(dt);
    if(S.phase==='landing') updateLanding(dt);
    if(S.parts2.length) updateParts2(dt);
    if(S.started && S.phase==='sea'){ updateFishing(dt); updateFever(dt); }
    updateParts(dt);
  }
  const p1=performance.now();
  draw(); drawRadar(); updateHUD();
  if(perf.on) perfTick(raw, p1-p0, performance.now()-p1);
  requestAnimationFrame(tick);
}

/* ================= 言語の適用 ================= */
function applyLang(){
  document.title = LANG==='en' ? 'Katsuo Isle' : 'カツオ島';
  const set=(id,k)=>{ const e=document.getElementById(id); if(e) e.textContent=t(k); };
  set('h1a','title.h1a'); set('h1b','title.h1b'); set('h1sub','title.sub');
  set('tapHint','title.tap'); set('retry','res.retry');
  set('lblTime','hud.time'); set('lblCatch','hud.catch'); set('lblCatchUnit','hud.catchUnit');
  set('lvlabel','hud.next');
  set('fvlabel','hud.fever'); set('fvbig','hud.fever');
  elFvRound.textContent=t('hud.round',{n:Math.max(1,S.fvRound)});
  set('lblPickEyebrow','pick.eyebrow'); set('lblPickHead','pick.head'); set('lblResHead','res.head');
  set('lblMenu','menu.head'); set('mClose','menu.close'); set('mHome','menu.home'); set('mReset','menu.reset');
  document.getElementById('mSound').firstChild.nodeValue=t('menu.sound');
  paintSound(); paintGear();
  document.querySelectorAll('#stats .chip b[data-k]').forEach(b=>{ b.textContent=t(b.dataset.k); });
  document.getElementById('titlebest').textContent = S.money ? '所持金 '+yen(S.money) : '';
  lastTxt={};
  updateHUD();
  if(S.mode==='levelup') showCards();
}
window.setGameLang=c=>{ setLang(c); applyLang(); };   // Playables では getLanguage の結果を渡す
window.addEventListener('keydown',e=>{                 // 検証用：デバッグ表示中に L で切り替え
  if(perf.on && (e.key==='l'||e.key==='L')) window.setGameLang(LANG==='ja'?'en':'ja');
});

/* ================= 起動 ================= */
initAssets(); initPatterns(); buildChips();
try{ const q=new URLSearchParams(location.search).get('lang'); if(q) setLang(q); }catch(e){}
loadGame();
applyFac();
buildPort();
try{ if(localStorage.getItem('ippon.perf')==='1') perfToggle(true); }catch(e){}
applyLang();
reset(); S.mode='play'; S.started=false; S.phase='port';
requestAnimationFrame(tick);
</script>
